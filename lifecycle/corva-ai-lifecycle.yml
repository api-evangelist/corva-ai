  detail: >-
    No public SLA or uptime commitment. Corva sells through enterprise agreements and AWS
    Marketplace private offers, so availability terms are contractual rather than published.
  evidence: https://aws.amazon.com/marketplace/pp/prodview-fkatffbptqdn4

