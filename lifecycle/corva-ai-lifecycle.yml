changelog:
  published: false
  detail: >-
    No dated API changelog or release-notes feed was found on any Corva host. Product announcements
    are published as blog posts under https://www.corva.ai/blog and company insights under
    https://www.corva.ai/company/insights, but neither is an API changelog: entries are marketing
    and case-study narratives, not versioned change records. No changelog/ artifact is emitted —
