generated: '2026-09-05'
method: derived
source: >-
  Derived from openapi/_original/corva-ai-platform-api-swagger-original.json and
  openapi/_original/corva-ai-data-api-openapi-original.json, cross-checked against the published
  documentation on https://dc-docs.corva.ai and the SOC 2 announcement on www.corva.ai.
description: >-
  Cross-cutting and domain-standard conformance for the Corva API surface. Reward-only: an entry
  with conforms:false records a standard we checked for and did not find, not a penalty.

conformance:
  - id: openapi-3.1
    conforms: true
    evidence: https://data.corva.ai/api/v1/openapi.json
    detail: >-
      The Corva Data API publishes a valid OpenAPI 3.1.0 document (40 operations, 35 component
      schemas) generated by FastAPI and served alongside Swagger UI at /docs and ReDoc at /redoc.
  - id: swagger-2.0
    conforms: true
    evidence: https://api.corva.ai/documentation/swagger.json
    detail: >-
      The Corva Platform API publishes a valid Swagger 2.0 document — 513 paths, 771 operations,
      574 definitions, version v2.222.1 — rendered by Swagger UI at /documentation/index.html.
      Swagger 2.0 is a superseded specification version; the surface has not been migrated to
      OpenAPI 3.x.
  - id: operation-ids
    conforms: false
    evidence: https://api.corva.ai/documentation/swagger.json
    detail: >-
      MEASURED DEFECT. The Platform API contract declares an operationId on only 4 of its 771
      operations (pads, fracFleets, getJwks, getRigTemplatesAggregatedValues) — 0.5% coverage.
      Every generated client, every agent tool binding and every crosswalk must therefore address
      Platform operations by METHOD+PATH. The Data API is the opposite: all 40 operations carry an
      operationId, though 33 of them are FastAPI's auto-generated function-name form (e.g.
      delete_many_api_v1_data__provider___dataset___delete) rather than a curated name. Only 3
      are hand-named (getDataByProviderAndDataset, listDataByProviderAndDataset).
  - id: operation-descriptions
    conforms: false
    evidence: https://api.corva.ai/documentation/swagger.json
    detail: >-
      All 771 Platform operations carry a summary, but only 51 (6.6%) carry a description. Corva's
      own docs acknowledge the gap: "The Swagger interfaces remain available as supplemental
      interactive explorers, but generated parameter descriptions and examples may lag behind the
      services."
  - id: unique-path-keys
    conforms: false
    evidence: https://api.corva.ai/documentation/swagger.json
    detail: >-
      SPEC-VALIDITY DEFECT, and it hits the most important endpoint in the contract. Five path
      keys carry a numeric fragment suffix: /v1/user_token#1, #2, #3 and #4, plus
      /v2/users/{user_id}/dashboards/{dashboard_id}/data_filters#2. A Swagger/OpenAPI path key
      must be a real URL path template; a fragment is not legal there. These are a generator
      workaround for operations that collided on one path.
      THE CONSEQUENCE IS CONCRETE: there is NO plain `/v1/user_token` key anywhere in the
      contract — the token endpoint that Corva's own authentication documentation tells every
      API-only customer to POST to exists in the spec only as four illegal fragment variants. A
      client generated from this document cannot authenticate without hand-editing, and an agent
      reading the contract alone would conclude the documented auth endpoint does not exist.
      Verified live: POST https://api.corva.ai/v1/user_token is real; only the contract's
      rendering of it is broken.
  - id: unique-parameter-names
    conforms: false
    evidence: https://api.corva.ai/documentation/swagger.json
    detail: >-
      Three operations declare the same query parameter twice — GET /v2/assets declares
      `api_number` twice, and GET /v2/groups/{group_id}/permissions/grouped and
      GET /v2/users/{user_id}/permissions/grouped each declare `category` twice. Duplicate
      parameter names in a single operation are invalid and cause generator collisions.
  - id: rfc9457
    conforms: false
    evidence: https://data.corva.ai/api/v1/openapi.json
    detail: >-
      No application/problem+json anywhere in either contract. The Data API returns a bespoke
      {"code": int, "message": string} envelope (schema title ExceptionResponse); the Platform API
      declares status codes with no documented error body schema at all.
  - id: pagination
    conforms: true
    evidence: https://dc-docs.corva.ai/docs/API/Core%20Concepts/query-controls
    detail: >-
      Both APIs paginate, but with two DIFFERENT documented styles. Platform API: page/per_page
      offset pagination (per_page appears on 72 operations, page on 64). Data API: limit (required,
      1-10,000) plus skip, with the docs explicitly recommending cursor-style paging on the last
      timestamp instead of an unbounded skip.
  - id: idempotency
    conforms: false
    evidence: https://dc-docs.corva.ai/docs/API/Core%20Concepts/limits-and-performance
    detail: >-
      No Idempotency-Key header, no client-supplied request key, and no replay semantics in either
      contract or anywhere in the documentation. See conventions/corva-ai-conventions.yml.
  - id: oauth2
    conforms: false
    evidence: https://dc-docs.corva.ai/docs/API/authentication
    detail: >-
      Corva does NOT use OAuth 2.0. Authentication is a static API key ("Authorization: API <key>")
      or a JWT obtained by POSTing Corva account credentials to /v1/user_token. There is no
      authorization endpoint, no scope parameter, no consent flow and no RFC 8414 metadata. Because
      there is no OAuth surface, no scopes/ artifact is emitted.
  - id: oidc
    conforms: false
    evidence: https://api.corva.ai/.well-known/openid-configuration
    detail: 404 on every host. No OpenID Provider metadata is published.
  - id: jwt
    conforms: true
    evidence: https://dc-docs.corva.ai/docs/API/authentication
    detail: >-
      Bearer credentials are JWTs with a standard exp claim (default 7-day lifetime, configurable
      by company security policy) and a paired refresh token (6-month lifetime) exchanged at the
      same endpoint. The docs correctly instruct clients to read exp rather than assume the default.
    caveat: >-
      A JWKS endpoint exists at https://api.corva.ai/v1/.well-known/jwks.json and answers 200, but
      publishes an EMPTY key array, so third parties cannot verify Corva JWTs offline.
  - id: rate-limit-headers
    conforms: false
    evidence: https://dc-docs.corva.ai/docs/API/Core%20Concepts/limits-and-performance
    detail: >-
      429 Too Many Requests is documented as a status an integration must handle and back off from,
      but NO rate-limit response headers are documented or declared — no RateLimit-*, no
      X-RateLimit-*, and no Retry-After. An agent cannot read its remaining budget at runtime.
  - id: json-api
    conforms: false
    evidence: https://api.corva.ai/documentation/swagger.json
    detail: >-
      Not JSON:API. Note that Platform /v2/wells responses do nest payload under an `attributes`
      object (the docs instruct reading attributes.asset_id), which resembles JSON:API but is not
      accompanied by the media type, top-level document structure or relationship objects the
      specification requires.
  - id: odata
    conforms: false
    evidence: https://data.corva.ai/api/v1/openapi.json
    detail: No $metadata surface and no OData query option vocabulary.
  - id: scim
    conforms: false
    evidence: https://api.corva.ai/documentation/swagger.json
    detail: >-
      No urn:ietf:params:scim:schemas:* URN anywhere in the contract, despite the Platform API
      carrying a substantial Users surface. User provisioning is Corva-proprietary.
  - id: asyncapi
    conforms: false
    evidence: https://api.corva.ai/asyncapi.yaml
    detail: >-
      404. Corva ships a real event surface (socketClient subscriptions, a message_producer write
      path, stream apps) but publishes no AsyncAPI document describing it. See
      asyncapi/corva-ai-event-surface.yml.
  - id: prometheus-exposition
    conforms: true
    evidence: https://data.corva.ai/api/v1/openapi.json
    detail: >-
      The Data API declares GET /metrics with the summary "Endpoint that serves Prometheus
      metrics." — an OpenMetrics/Prometheus exposition surface declared in the contract itself.

domain_standards:
  checked_regime: energy / oil and gas upstream operations
  result: >-
    NO domain standard is declared by either contract. This is recorded as an honest absence, not a
    penalty — the reward-only rule applies.
  detail: >-
    Upstream oil and gas has real interchange standards that a drilling and completions data
    platform could plausibly speak: WITSML and WITS (Energistics, real-time rig data), PRODML,
    RESQML, and PPDM for subsurface/production data models. NONE of them appear in either Corva
    contract — no WITSML SOAP or ETP endpoint, no PRODML message type, no PPDM identifier scheme,
    and no mention in the documentation set that was reachable. Corva's own transport is a
    proprietary provider#dataset namespace (the docs' worked example is `corva#wits`) reached over REST.
  note: >-
    The dataset naming is suggestive — Corva's flagship real-time collection is literally named
    `corva#wits`, i.e. Corva's own rendering of WITS-shaped rig data — but a dataset NAME is not a
    standard conformance claim, and nothing in the contract declares WITS/WITSML semantics,
    versions or schemas. The evidence is explicit and cuts both ways: the Data API's
    DatasetSerializer schema carries the literal example name `corva#wits` with the description
    "Save WITS data", so Corva is unambiguously handling WITS-shaped rig data — while modelling it
    as a free-form `data` object under its own provider#collection namespace rather than against a
    published WITS or WITSML schema. Recorded as not-conformant rather than inferred into a claim
    Corva does not make. A future round with authenticated dataset-schema access could revisit it.
  candidates_probed:
    - standard: WITSML (Energistics)
      found: false
      evidence: https://api.corva.ai/documentation/swagger.json
    - standard: PRODML (Energistics)
      found: false
      evidence: https://api.corva.ai/documentation/swagger.json
    - standard: PPDM
      found: false
      evidence: https://api.corva.ai/documentation/swagger.json

compliance:
  - id: soc2
    conforms: true
    evidence: https://www.corva.ai/blog/corva-maintains-effective-security-controls-according-to-recent-soc-2-report
    detail: >-
      Corva published a SOC 2 examination report issued by BARR Advisory, P.A., announced
      2025-05-15. Corva states the examination covered the Security, Availability, Processing
      Integrity, Confidentiality and Privacy trust services criteria plus HIPAA Security Rule
      requirements, and concluded that management maintained effective controls over the security
      and availability of the Corva Platform system.
    caveat: >-
      The announcement does not state SOC 2 Type I vs Type II, and the report itself is not
      publicly downloadable. There is no trust center: trust.corva.ai does not resolve and
      www.corva.ai/security is a 404.
