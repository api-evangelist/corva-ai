summary:
  first_party_package_count: 9
  third_party_package_count: 7
  registries: [npm, pypi]
  note: >-
    Corva publishes a genuinely maintained SDK surface. Eight first-party npm packages under the
    @corva scope back the Dev Center frontend/app-building story and one PyPI distribution
    (corva-sdk) backs the Python backend-app story. Currency is good: six of the nine shipped a
    release within the last five weeks of 2026-09-05.
  decay_signal: >-
    ONE clear laggard. @corva/node-sdk — the Node.js SDK for building Corva apps, and the direct
    counterpart to the Python corva-sdk — last published a stable release on 2023-12-05 (8.5.0),
    nearly three years before this pass. Prerelease work continued (8.6.0-rc.10) but never
    graduated. Meanwhile corva-sdk (Python) shipped 2.1.1 on 2026-01-15 and the frontend packages
    ship monthly. A consumer choosing the Node SDK today is choosing the abandoned half of a
    two-language SDK story; the Dev Center docs still document both.

