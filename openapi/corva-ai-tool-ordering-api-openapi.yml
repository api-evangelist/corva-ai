openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Tool Ordering API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Tool Ordering
  description: Customer tool order create/edit/submit and the specification definition registry
paths:
  /v2/tool_ordering/orders:
    get:
      summary: List Tool Orders
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Tool Ordering is disabled for the current company (code 'feature_disabled')
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List of tool orders for the current company, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderList'
      parameters:
      - in: query
        name: status
        description: Filter by exact status
        required: false
        schema:
          type: string
      - in: query
        name: active
        description: '''true'' excludes received_on_rig/cancelled/rejected orders; ''false'' returns only those'
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Page number
        required: false
        schema:
          type: integer
      - in: query
        name: per_page
        description: Items per page
        required: false
        schema:
          type: integer
      operationId: getV2ToolOrderingOrders
      x-operation-id-source: derived
    post:
      summary: Create Tool Order
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Tool Ordering is disabled for the current company (code 'feature_disabled')
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '201':
          description: Created draft order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '400':
          description: 'Validation error: invalid asset/vendor, missing components, or bad quantity'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolOrderPayload'
        required: true
      operationId: postV2ToolOrderingOrders
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{id}:
    get:
      summary: Get Tool Order
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Tool Ordering is disabled for the current company (code 'feature_disabled')
        '404':
          description: Tool order not found
        '200':
          description: Tool order details, including components
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2ToolOrderingOrdersById
      x-operation-id-source: derived
    patch:
      summary: Update Draft Tool Order
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '409':
          description: Order is no longer a draft
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolOrderPayload'
        required: true
      operationId: patchV2ToolOrderingOrdersById
      x-operation-id-source: derived
    delete:
      summary: Delete Draft Tool Order
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Deleted
        '409':
          description: Order is no longer a draft
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      operationId: deleteV2ToolOrderingOrdersById
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{id}/submit:
    post:
      summary: Submit Tool Order
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Order moved to awaiting_acknowledgement; every component submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '400':
          description: 'Validation error: inactive vendor, vendor with no eligible notification recipient, an unselectable recipient_user_id, invalid specs, or a tool family over its max quantity'
        '409':
          description: Order is not a draft
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              properties:
                tool_order:
                  type: object
                  properties:
                    recipient_user_ids:
                      type: array
                      items:
                        type: integer
                        format: int64
                      description: Subset of eligible vendor notification recipients to email; omit/empty to notify all of them
      operationId: postV2ToolOrderingOrdersByIdSubmit
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{id}/acknowledge:
    post:
      summary: Acknowledge Tool Order (vendor action)
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Vendor access required (code 'not_authorized')
        '404':
          description: Order not found, draft, or not visible to this vendor
        '200':
          description: Order acknowledged; idempotent if already acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '409':
          description: Order is not awaiting acknowledgement
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      operationId: postV2ToolOrderingOrdersByIdAcknowledge
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{id}/cancel:
    post:
      summary: Cancel Tool Order
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Not authorized (neither vendor access nor internal update access)
        '404':
          description: Order not found or not visible
        '200':
          description: Order and its cancellable components cancelled; allowed for the vendor (same-customer active membership) or an internal user with update access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '400':
          description: reason is missing, not a string, or too long
        '409':
          description: Order has not been submitted, is already terminal, or a component has shipped
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              properties:
                reason:
                  type: string
        required: true
      operationId: postV2ToolOrderingOrdersByIdCancel
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/components/{id}/transition:
    post:
      summary: Transition Order Component Status (vendor action)
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Vendor access required (code 'not_authorized')
        '404':
          description: Order or component not found or not visible to this vendor
        '200':
          description: Component transitioned; order status re-derived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '400':
          description: Unsupported target status, or the transition is not legal from the current status
        '409':
          description: Order is not acknowledged, or is no longer active
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              properties:
                to:
                  type: string
                  enum:
                  - in_progress
                  - ready_to_ship
                  - shipped
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdComponentsByIdTransition
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/components/{id}/final_specs:
    patch:
      summary: Update Order Component Final Specs (vendor action)
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Vendor access required (code 'not_authorized')
        '404':
          description: Order or component not found or not visible to this vendor
        '200':
          description: Component final specs and/or serial number updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '400':
          description: final_specs is not an object, or the payload is too large
        '409':
          description: Order is read only, or the component is not active
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              properties:
                final_specs:
                  type: object
                  description: Omit to leave untouched; {} clears it
                serial_number:
                  type: string
                  description: Omit to leave untouched; null clears it
        required: true
      operationId: patchV2ToolOrderingOrdersByOrderIdComponentsByIdFinalSpecs
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/components/receive:
    post:
      summary: Receive Shipped Order Components On Rig (internal action)
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Internal update permission required, or Tool Ordering is disabled
        '404':
          description: Order is not internally accessible, or a component does not belong to it
        '200':
          description: Components received; order status re-derived once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolOrderSingle'
        '400':
          description: component_ids is missing, empty, or contains an invalid ID
        '409':
          description: Order is not acknowledged/active, or a component is not shipped
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - component_ids
              properties:
                component_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                    format: int64
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdComponentsReceive
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/proposals:
    get:
      summary: List Component Change Proposals
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Tool Ordering is disabled or a named user is required
        '404':
          description: Order not found or not visible to the user
        '200':
          description: Proposals visible to the internal or vendor user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposalList'
        '400':
          description: Invalid status filter
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - all
          default: pending
      operationId: getV2ToolOrderingOrdersByOrderIdProposals
      x-operation-id-source: derived
    post:
      summary: Submit Component Change Proposal (vendor action)
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Vendor access required (code 'not_authorized')
        '404':
          description: Order or component not found or not visible to this vendor
        '201':
          description: Created pending proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposalSingle'
        '400':
          description: Invalid fields/specifications, no actual change, payload too large, or reason is invalid
        '409':
          description: Order/component is inactive, baseline is stale, or a pending proposal already exists
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - component_id
              - proposed_changes
              - reason
              properties:
                component_id:
                  type: integer
                  format: int64
                proposed_changes:
                  type: object
                reason:
                  type: string
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdProposals
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/proposals/{id}/approve:
    post:
      summary: Approve Component Change Proposal
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Internal update permission required
        '404':
          description: Order or proposal not found in the authorized scope
        '200':
          description: Approved proposal and resulting order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposalDecisionSingle'
        '400':
          description: Invalid decision comment or resulting specifications
        '409':
          description: Stale proposal, inactive order/component, or proposal was already rejected
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              properties:
                decision_comment:
                  type: string
                  description: Optional, maximum 2,000 characters
      operationId: postV2ToolOrderingOrdersByOrderIdProposalsByIdApprove
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/proposals/{id}/reject:
    post:
      summary: Reject Component Change Proposal
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Internal update permission required
        '404':
          description: Order or proposal not found in the authorized scope
        '200':
          description: Rejected proposal and resulting order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposalDecisionSingle'
        '400':
          description: Decision comment is missing or invalid
        '409':
          description: Inactive order/component, or proposal was already approved
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - decision_comment
              properties:
                decision_comment:
                  type: string
                  description: Required, maximum 2,000 characters
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdProposalsByIdReject
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/proposals/approve_all:
    post:
      summary: Approve Selected Component Change Proposals Atomically
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Internal update permission required
        '404':
          description: Order or any requested proposal not found in the authorized scope
        '200':
          description: Requested proposals and resulting order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposalDecisionList'
        '400':
          description: proposal_ids or decision comment is invalid
        '409':
          description: Any proposal is stale, inactive, or was already rejected; no proposals are changed
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - proposal_ids
              properties:
                proposal_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                decision_comment:
                  type: string
                  description: Optional, maximum 2,000 characters
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdProposalsApproveAll
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/proposals/reject_all:
    post:
      summary: Reject Selected Component Change Proposals Atomically
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Internal update permission required
        '404':
          description: Order or any requested proposal not found in the authorized scope
        '200':
          description: Requested proposals and resulting order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeProposalDecisionList'
        '400':
          description: proposal_ids or decision comment is invalid
        '409':
          description: Any proposal is inactive or was already approved; no proposals are changed
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - proposal_ids
              - decision_comment
              properties:
                proposal_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                decision_comment:
                  type: string
                  description: Required, maximum 2,000 characters
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdProposalsRejectAll
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/attachments:
    get:
      summary: List Order Attachments
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Tool Ordering is disabled or a named user is required
        '404':
          description: Order not found or not visible to the user
        '200':
          description: Attachments visible to the internal or vendor user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAttachmentList'
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: component_id
        required: false
        description: Only attachments of this component
        schema:
          type: integer
          format: int64
      operationId: getV2ToolOrderingOrdersByOrderIdAttachments
      x-operation-id-source: derived
    post:
      summary: Register Uploaded Order Attachment
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Vendor action rights or internal update permission required
        '404':
          description: Order or component not found in the authorized scope
        '201':
          description: Attachment registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAttachmentSingle'
        '400':
          description: s3_key is foreign/unuploaded, the file is too large, or file_name is invalid
        '409':
          description: Order is inactive or the s3_key is already registered
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - s3_key
              - file_name
              properties:
                s3_key:
                  type: string
                  description: Value returned by the signed_url endpoint
                file_name:
                  type: string
                component_id:
                  type: integer
                  format: int64
                  description: Attach to one component of the order (submitted orders only, draft components are replaced wholesale on edit); omit for order-level
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdAttachments
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/attachments/signed_url:
    post:
      summary: Presign Order Attachment Upload
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Vendor action rights or internal update permission required
        '404':
          description: Order not found in the authorized scope
        '200':
          description: Presigned PUT URL; upload the file body there, then register it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAttachmentPresign'
        '400':
          description: file_name is missing/unsupported, or content_type does not match the extension
        '409':
          description: Order is inactive
      parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - file_name
              - content_type
              properties:
                file_name:
                  type: string
                  description: 'Allowed extensions: .pdf, .doc, .docx, .xls, .xlsx, .ppt, .pptx, .csv, .txt, .png, .jpg, .jpeg, .heic'
                content_type:
                  type: string
                  description: Must match the file_name extension
        required: true
      operationId: postV2ToolOrderingOrdersByOrderIdAttachmentsSignedUrl
      x-operation-id-source: derived
  /v2/tool_ordering/orders/{order_id}/attachments/{id}:
    delete:
      summary: Delete Order Attachment
      tags:
      - Tool Ordering
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Only the uploader or an internal user with update permission can delete
        '404':
          description: Order or attachment not found in the authorized scope
        '200':
          description: Attachment removed from the order and the file store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAttachmentDeleted'
        '409':
          description: Order is inactive
      parameters:
      - in: path
        name: order_id
        required: true
