components:
  schemas:
    DistributionContact:
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
    VendorDirectoryList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VendorDirectoryEntry'
    ChangeProposalComponent:
      properties:
        id:
          type: integer
          format: int64
        position:
          type: integer
        tool_family:
          type: string
        tool_type:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
          - in_progress
          - ready_to_ship
          - shipped
          - received_on_rig
          - cancelled
          - rejected
        requested_specs:
          type: object
        accepted_specs:
          type: object
        effective_specs:
          type: object
        rejected_at:
          type: string
          format: date-time
    VendorSingle:
      properties:
        data:
          type: object
          $ref: '#/components/schemas/Vendor'
    ToolOrderList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ToolOrder'
    OrderAttachmentSingle:
      properties:
        data:
          type: object
          $ref: '#/components/schemas/OrderAttachment'
    VendorContact:
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        phone:
          type: string
    VendorDirectoryEntry:
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        vendor_name:
          type: string
        vendor_id:
          type: integer
          format: int64
    ChangeProposalSingle:
      properties:
        data:
          type: object
          $ref: '#/components/schemas/ChangeProposal'
    OrderAttachmentDeleted:
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              format: int64
            status:
              type: string
              enum:
              - deleted
    ChangeProposalList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChangeProposal'
    VendorMembership:
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        user_name:
          type: string
        user_email:
          type: string
        active:
          type: boolean
        receives_notifications:
          type: boolean
        deactivated_at:
          type: string
          format: date-time
    ToolOrderingSpecification:
      properties:
        tool_family:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ToolOrderingSpecificationField'
        constraints:
          type: object
          properties:
            max_quantity:
              type: integer
    ToolOrderPayload:
      properties:
        tool_order:
          type: object
          properties:
            asset_id:
              type: integer
              format: int64
              description: Create only; the well this order is for
            vendor_id:
              type: integer
              format: int64
            well_name:
              type: string
              description: Defaults to the asset name when omitted on create
            rig_name:
              type: string
              description: Defaults to the asset's parent rig name when omitted on create
            operator_name:
              type: string
              description: Defaults to the company name when omitted on create
            well_api:
              type: string
            county:
              type: string
            state:
              type: string
            hole_size:
              type: string
            preferred_trucking:
              type: string
            inspection_requirements:
              type: string
            order_notes:
              type: string
            requested_delivery_date:
              type: string
              format: date
            components:
              type: array
              description: On update, replaces all components wholesale; omit the key to leave existing components untouched
              items:
                properties:
                  tool_family:
                    type: string
                  tool_type:
                    type: string
                  quantity:
                    type: integer
                    description: Expands into that many component rows; defaults to 1
                  requested_specs:
                    type: object
                    description: Free-form per tool_family; see GET /v2/tool_ordering/specifications
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    ToolOrder:
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          required:
          - id
          - reference_number
          - status
          - company_id
          - vendor_id
          - asset_id
          - requester_id
          properties:
            id:
              type: integer
              format: int64
            reference_number:
              type: string
              description: Format <VENDOR_ACRONYM><year>-<3-digit seq>, e.g. GM2026-007; orders created before the vendor acronym rollout keep the legacy TO-<year>-<4-digit seq> form. Unique per company
            status:
              type: string
              enum:
              - draft
              - awaiting_acknowledgement
              - acknowledged
              - in_progress
              - ready_to_ship
              - partially_shipped
              - shipped
              - received_on_rig
              - cancelled
              - rejected
            company_id:
              type: integer
              format: int64
            vendor_id:
              type: integer
              format: int64
            asset_id:
              type: integer
              format: int64
              description: The well this order is for
            requester_id:
              type: integer
              format: int64
            well_name:
              type: string
            rig_name:
              type: string
            operator_name:
              type: string
            well_api:
              type: string
            county:
              type: string
            state:
              type: string
            hole_size:
              type: string
            preferred_trucking:
              type: string
            inspection_requirements:
              type: string
            order_notes:
              type: string
            requested_delivery_date:
              type: string
              format: date
            recipient_user_ids:
              type: array
              items:
                type: integer
                format: int64
              description: Vendor membership user ids selected as new-order email recipients at submission; empty means all eligible recipients
            submitted_at:
              type: string
              format: date-time
            cancellation_reason:
              type: string
              description: Reason supplied when the order was cancelled
            cancelled_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            vendor_name:
              type: string
            components:
              type: array
              items:
                $ref: '#/components/schemas/ToolOrderComponent'
    ChangeProposalDecisionSingle:
      properties:
        data:
          type: object
          $ref: '#/components/schemas/ChangeProposal'
        order_status:
          type: string
          enum:
          - draft
          - awaiting_acknowledgement
          - acknowledged
          - in_progress
          - ready_to_ship
          - partially_shipped
          - shipped
          - received_on_rig
          - cancelled
          - rejected
    ChangeProposal:
      properties:
        id:
          type: integer
          format: int64
        tool_order_component_id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        proposed_changes:
          type: object
          description: Server-normalized field diffs in { from, to } form
        reason:
          type: string
        proposer:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        decider:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        decision_comment:
          type: string
        component:
          type: object
          $ref: '#/components/schemas/ChangeProposalComponent'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time
    VendorMembershipList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VendorMembership'
    VendorPayload:
      properties:
        vendor:
          type: object
          properties:
            name:
              type: string
            acronym:
              type: string
              description: Optional; derived from the name when omitted. Uppercased on write, must be unique per company
            active:
              type: boolean
              description: 'false deactivates the vendor: hidden from the default list and rejected for new orders and contacts, while memberships and order history stay. true reactivates. The name stays reserved, so reactivate instead of recreating'
            phones:
              type: array
              items:
                type: string
            supported_tool_families:
              type: array
              items:
                type: string
            member_user_ids:
              type: array
              description: 'Optional. When present, the vendor members are synced to exactly these company user ids: new ones are granted vendor access (membership + vendor_tool_order group), missing ones are deactivated. Requires manage permission on the vendor (company admin) and a named user'
              items:
                type: integer
                format: int64
    DeletedStatus:
      properties:
        status:
          type: string
          enum:
          - deleted
    VendorContactPayload:
      properties:
        vendor_contact:
          type: object
          required:
          - name
          - email
          properties:
            vendor_id:
              type: integer
              format: int64
              description: Existing vendor to attach the contact to
            vendor_name:
              type: string
              description: Find-or-create a vendor by name (case-insensitive) when vendor_id is omitted
            name:
              type: string
            email:
              type: string
            phone:
              type: string
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    VendorContactCreated:
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            email:
              type: string
            phone:
              type: string
            vendor_id:
              type: integer
              format: int64
    ToolOrderingSpecificationField:
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
          - text
          - enum
        required:
          type: boolean
        enum:
          type: array
          items:
            type: string
    ToolOrderSingle:
      properties:
        data:
          type: object
          $ref: '#/components/schemas/ToolOrder'
    ChangeProposalDecisionList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChangeProposal'
        order_status:
          type: string
          enum:
          - draft
          - awaiting_acknowledgement
          - acknowledged
          - in_progress
          - ready_to_ship
          - partially_shipped
          - shipped
          - received_on_rig
          - cancelled
          - rejected
    DistributionContactSingle:
      properties:
        data:
          type: object
          $ref: '#/components/schemas/DistributionContact'
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    VendorMembershipSingle:
      properties:
        data:
          type: object
          $ref: '#/components/schemas/VendorMembership'
    OrderAttachmentList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderAttachment'
    DistributionContactList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DistributionContact'
    ToolOrderComponent:
      properties:
        id:
          type: integer
          format: int64
        position:
          type: integer
        tool_family:
          type: string
        tool_type:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
          - in_progress
          - ready_to_ship
          - shipped
          - received_on_rig
          - cancelled
          - rejected
        requested_specs:
          type: object
          description: Free-form per tool_family; see GET /v2/tool_ordering/specifications
        accepted_specs:
          type: object
          description: Latest approved specification snapshot, or null
        effective_specs:
          type: object
          description: accepted_specs when present; otherwise requested_specs
        final_specs:
          type: object
          description: As-built specifications supplied by the vendor
        rejected_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        received_by:
          type: object
          description: Internal user who recorded receipt; null until received. Vendor payloads contain id and name only.
          properties:
            id:
              type: integer
              format: int64
            email:
              type: string
            first_name:
              type: string
            last_name:
              type: string
        inventory_sync_state:
          type: string
          enum:
          - not_started
          - pending
          - synced
          - failed
    OrderAttachment:
      properties:
        id:
          type: integer
          format: int64
        tool_order_component_id:
          type: integer
          format: int64
          description: Null for order-level attachments
        file_name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        uploaded_by:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        download_url:
          type: string
          description: Presigned URL, valid for 15 minutes
        created_at:
          type: string
          format: date-time
    OrderAttachmentPresign:
      properties:
        data:
          type: object
          properties:
            signed_url:
              type: string
              description: PUT the file body here within 15 minutes, sending required_headers verbatim
            s3_key:
              type: string
              description: Pass back to POST /attachments after the upload
            required_headers:
              type: object
              description: Headers the PUT request must include exactly (they are part of the URL signature); currently only Content-Type
    Vendor:
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          required:
          - id
          - name
          - active
          - company_id
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            acronym:
              type: string
              description: Uppercase 2-6 alphanumerics, unique per company, used as the order reference prefix. Derived from the name when omitted on create
            active:
              type: boolean
            company_id:
              type: integer
              format: int64
            linked_company_id:
              type: integer
              format: int64
            phones:
              type: array
              items:
                type: string
            supported_tool_families:
              type: array
              items:
                type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/VendorContact'
            members:
              type: array
              description: Vendor memberships (active and deactivated) with the member user inlined
              items:
                $ref: '#/components/schemas/VendorMembership'
    VendorMembershipCreatePayload:
      properties:
        vendor_membership:
          type: object
          required:
          - user_id
          properties:
            user_id:
              type: integer
              format: int64
              description: Must belong to the vendor customer company
    VendorMembershipUpdatePayload:
      properties:
        vendor_membership:
          type: object
          properties:
            active:
              type: boolean
              description: false deactivates (revokes access immediately), true reactivates
            receives_notifications:
              type: boolean
    VendorList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vendor'
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
