components:
  schemas:
    DashboardFolderDashboardSharePayload:
      properties:
        dashboard_folder_dashboard_share:
          type: object
          properties:
            dashboard_share_id:
              type: integer
            position:
              type: integer
      example:
        dashboard_folder_dashboard_share:
          dashboard_share_id: 123
          position: 13
    DashboardFolderShareCreatePayload:
      properties:
        dashboard_folder_share:
          type: object
          properties:
            owner_id:
              type: integer
            dashboard_folder_id:
              type: integer
      example:
        dashboard_folder_share:
          owner_id: 1234
          dashboard_folder_id: 1234
    DashboardFolderDashboardShareUpdatePayload:
      properties:
        dashboard_folder_dashboard_share:
          type: object
          properties:
            position:
              type: integer
      example:
        dashboard_folder_dashboard_share:
          position: 13
    DashboardFolder:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            position:
              type: integer
              format: int64
            user_id:
              type: integer
              format: int64
            type:
              type: string
        relationships:
          type: object
          properties:
            user:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
            dashboard_folder_dashboard_shares:
              type: object
              properties:
                data:
                  type: array
      example:
        id: 123
        type: dashboard_folder
        attributes:
          id: '123'
          name: Folder 1
          user_id: 1234
          type: archive
          position: 1
        relationships:
          user:
            data:
              id: '1234'
              type: user
          dashboard_folder_dashboard_shares:
            data: []
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    DashboardFolderDashboardShare:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            dashboard_folder_id:
              type: integer
              format: int64
            dashboard_share_id:
              type: integer
              format: int64
            position:
              type: integer
              format: int64
        relationships:
          type: object
          properties:
            dashboard_folder:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
            dashboard_share:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
      example:
        id: 123
        type: dashboard_folder_dashboard_share
        attributes:
          id: '123'
          dashboard_folder_id: 123
          dashboard_share_id: 1234
          position: 1
        relationships:
          dashboard_folder:
            data:
