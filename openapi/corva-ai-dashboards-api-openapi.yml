        '200':
          description: Created dashboard app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardApp'
      parameters:
      - in: path
        name: user_id
        description: User ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: dashboard_id
        description: Dashboard ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: filter_asset_id
        description: Data filter's Asset ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema: {}
        description: Coordinates for the new dashboard app
        required: true
      operationId: postV2UsersByUserIdDashboardsByDashboardIdDashboardApps
      x-operation-id-source: derived
