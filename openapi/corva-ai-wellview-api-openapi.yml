        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List all data for the BHA dataset
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WellViewBHA'
      parameters:
      - in: query
        name: asset_id
        description: Corva Asset ID
        schema:
          type: integer
      - in: query
        name: query
        description: Open-ended data query, such as {timestamp#gte#1577836800}. Be sure to URL encode.
        schema:
          type: string
      - in: query
        name: sort
        description: Field to sort by, and the direction to sort in (asc is 1, desc is -1)
        schema:
          type: string
          default: '{timestamp: -1}'
      - in: query
        name: limit
        description: Number of records to retrieve
        schema:
          type: integer
          default: 1
      operationId: getV2IntegrationWellviewBha
      x-operation-id-source: derived
