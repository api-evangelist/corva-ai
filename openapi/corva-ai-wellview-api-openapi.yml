openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Well View API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: WellView
  description: WellView 3rd-Party integration
paths:
  /v2/integration/wellview/resolve:
    post:
      summary: Resolve an asset based on an array of lookups
      tags:
      - WellView
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Show asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
      requestBody:
        content:
          application/json:
            schema: {}
        description: 'Array of values such as Asset ID, API number, or well name. First successful match wins. Example: [31, "My Well", "42-501-20130"]'
      operationId: postV2IntegrationWellviewResolve
      x-operation-id-source: derived
  /v2/integration/wellview/ingest:
    post:
      summary: Send data into Corva for processing
      tags:
      - WellView
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Send the data for processing
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WellViewIngest'
      requestBody:
        content:
          application/json:
            schema: {}
        description: JSON-formatted data sent as the entire request body in array format
      operationId: postV2IntegrationWellviewIngest
      x-operation-id-source: derived
  /v2/integration/wellview/bha:
    get:
      summary: Retrieve Corva BHA/Drillstring data
      tags:
      - WellView
      responses:
        '401':
          description: Authentication error
