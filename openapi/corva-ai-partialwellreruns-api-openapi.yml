openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Partial Well Reruns API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: PartialWellReruns
paths:
  /v2/partial_reruns:
    get:
      summary: List Partial Well Reruns
      tags:
      - PartialWellReruns
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List of Partial Well Reruns
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartialWellRerun'
      parameters:
      - in: query
        name: status
        description: Filter by multiple statuses
        schema:
          items:
            type: string
            enum:
            - initialized
            - running
            - pending_merge
            - merge_initialized
            - merging
            - failed
            - stopped
            - completed
      - in: query
        name: company_id
        description: Filter by company_id
        schema:
          type: integer
      - in: query
        name: rig_id
        description: Filter by rig_id
        schema:
          type: integer
      - in: query
        name: start_timestamp
        description: Filter runs that started later than start_timestamp. start_timestamp is in seconds
        schema:
          type: integer
      - in: query
        name: user_email
        description: Filter by user email. Can filter by parts of email
        schema:
          type: string
      - in: query
        name: well_id
        description: Filter by source's and target's well id
        schema:
          type: integer
      - in: query
        name: start
        description: Unix timestamp in seconds that filters reruns by created date and are created later than param specified
        schema:
          type: integer
      - in: query
        name: end
        description: Unix timestamp in seconds that filters reruns by created date and are created before than param specified
        schema:
          type: integer
      - in: query
        name: mergeable
        description: Filter by mergeable status
        schema:
          type: boolean
      - in: query
        name: order
        description: Order partial well reruns by 'asc' or 'desc'
        schema:
          type: string
      - in: query
        name: sort
        description: Available sort values - id, company, rig, source_well_name, target_well_name, start_timestamp, status, created_at
        schema:
          type: string
      operationId: getV2PartialReruns
      x-operation-id-source: derived
  /v2/partial_reruns/list:
    post:
      summary: List Partial Well Reruns
      tags:
      - PartialWellReruns
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List of Partial Well Reruns
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartialWellRerun'
      requestBody:
        content:
          application/json:
            schema: {}
        description: Available sort values - id, company, rig, source_well_name, target_well_name, start_timestamp, status, created_at
      operationId: postV2PartialRerunsList
      x-operation-id-source: derived
  /v2/partial_reruns/{id}:
    get:
      summary: Show Partial Well Rerun
      tags:
      - PartialWellReruns
      responses:
        '401':
          description: Authentication error
          content:
