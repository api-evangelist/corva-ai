        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Partial Well Rerun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartialWellRerunFull'
      parameters:
      - in: path
        name: id
        description: Partial Well Rerun ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2PartialRerunsById
      x-operation-id-source: derived
    patch:
      summary: Update Partial Well Rerun
      tags:
