components:
  schemas:
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    UpdatePartialWellRerunAppProgressPayload:
      properties:
        app_progress:
          type: object
          properties:
            status:
              type: integer
            completed_app_connection:
              type: integer
            fail_reason:
              type: string
            dataset_progresses:
              type: array
              properties:
                dataset_id:
                  type: integer
                processed_timestamp:
                  type: integer
                completed:
                  type: boolean
            app_connection_progresses:
              type: array
              properties:
                dataset_id:
                  type: integer
                completed:
                  type: boolean
      example:
        app_progress:
          status: completed
          completed_app_connection: 123
          fail_reason: Failed
          dataset_progresses:
          - dataset_id: 345
            processed_timestamp: 55560
            completed: false
          app_connection_progresses:
          - app_connection_id: 345
            completed: false
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    UpdatePartialWellRerunPayload:
      properties:
        rerun:
          type: object
          properties:
            status:
              type: string
            start_timestamp:
              type: integer
            end_timestamp:
              type: integer
            app_progresses:
              type: array
              properties:
                app_id:
                  type: integer
                status:
                  type: integer
                dataset_progresses:
                  type: array
                  properties:
                    dataset_id:
                      type: integer
                    processed_timestamp:
                      type: integer
                    completed:
                      type: boolean
                app_connection_progresses:
                  type: array
                  properties:
                    app_connection_id:
                      type: integer
                    completed:
                      type: boolean
      example:
        rerun:
          status: stopped
          start_timestamp: 55555
          end_timestamp: 66666
          data_source: witsml
          app_progresses:
          - app_id: 249
            status: completed
            dataset_progresses:
            - dataset_id: 345
              processed_timestamp: 55560
              completed: false
            app_connection_progresses:
            - app_connection_id: 567
              completed: false
    PartialWellRerunFull:
      properties:
        data:
          $ref: '#/components/schemas/PartialWellRerun'
        included:
          type: array
          items:
            $ref: '#/components/schemas/PartialWellRerunAppProgress'
      example:
        data:
          id: '123'
          type: partial_well_rerun
          attributes:
            id: 123
            source_asset_id: 555
            target_asset_id: 999
            source_well_name: Original well
            target_well_name: Target well
            source_app_stream_id: 1395
            target_app_stream_id: 1402
            rerun_mode: live
            start_timestamp: 1543847760
            end_timestamp: null
            rig_id: 111
            rig_name: The drill
            company_id: 222
            company_name: Mainframe
            status: running
            created_at:
              first_name: Tom
              last_name: Jerry
              profile_photo: null
              email: tomjerry@gmail.com
            mergeable: false
            mergeable_reason: All streams are not synchronized
          relationships:
            app_progresses:
              data:
              - id: '123'
                type: partial_well_rerun_app_progress
        included:
        - id: '123'
          type: partial_well_rerun_app_progress
          attributes:
            app_id: 44
            status: merging
            app_key: corva.enrichment-wrapper
            relationships:
              dataset_progresses:
                data:
                - id: '4'
                  type: partial_well_rerun_dataset_progress
              app_connection_progresses:
                data:
                - id: '5'
                  type: partial_well_rerun_app_connection_progress
    PartialWellRerun:
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            source_asset_id:
              type: integer
              format: int64
            target_asset_id:
              type: integer
              format: int64
            source_well_name:
              type: string
            target_well_name:
              type: string
            source_app_stream_id:
              type: integer
              format: int64
            target_app_stream_id:
              type: integer
              format: int64
            rerun_mode:
              type: string
            start_timestamp:
              type: integer
              format: int64
            end_timestamp:
              type: integer
              format: int64
            rig_id:
              type: integer
              format: int64
            rig_name:
              type: string
            company_id:
              type: integer
              format: int64
            company_name:
              type: integer
              format: int64
            status:
              type: string
            completed_at:
              type: string
              format: date-time
            merge_started_at:
              type: string
              format: date-time
            completion_rate:
              type: float
            created_by:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                profile_photo:
                  type: string
                email:
                  type: string
            mergeable:
              type: boolean
            fail_reasons:
              type: object
              properties:
                app_name:
                  type: string
                app_id:
                  type: integer
                  format: int64
                fail_reason:
                  type: string
        relationships:
          type: object
          properties:
            app_progresses:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: string
                    type:
                      type: string
      example:
        id: '123'
        type: partial_well_rerun
        attributes:
          id: 123
          source_asset_id: 555
          target_asset_id: 999
          source_well_name: Original well
          target_well_name: Target well
          source_app_stream_id: 1395
          target_app_stream_id: 1402
          rerun_mode: live
          start_timestamp: 1543847760
          end_timestamp: null
          rig_id: 111
          rig_name: The drill
          company_id: 222
          company_name: Mainframe
          completed_at: '2010-01-01T00:00:00.000Z'
          merge_started_at: '2010-01-01T00:00:00.000Z'
          status: running
          created_at:
            first_name: Tom
            last_name: Jerry
            profile_photo: null
            email: tomjerry@gmail.com
          mergeable: false
          mergeable_reason: All streams are not synchronized
          fail_reasons:
          - app_name: App
            app_id: 123
            fail_reason: Failed
        relationships:
          app_progresses:
            data:
            - id: '123'
              type: partial_well_rerun_app_progress
    PartialWellRerunDatasetProgress:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            dataset_id:
              type: integer
              format: int64
            processed_timestamp:
              type: integer
            completed:
              type: boolean
            dataset_name:
              type: string
      example:
        id: 123
        type: partial_well_rerun_dataset_progress
        attributes:
          id: 100
          dataset_id: 786
          processed_timestamp: 58457475
          completed: false
          dataset_name: New dataset
    PartialWellRerunAppProgress:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            app_id:
              type: integer
              format: int64
            app_key:
              type: string
            app_name:
              type: string
            status:
              type: string
            fail_reason:
              type: string
            rerun_status:
              type: string
            rerun_completion_rate:
              type: float
            partial_well_rerun_id:
              type: integer
              format: int64
        relationships:
          type: object
          properties:
            dataset_progresses:
              type: array
              items:
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: string
                      type:
                        type: string
            app_connection_progresses:
              type: array
              items:
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: string
                      type:
                        type: string
        included:
          type: array
          items:
            $ref: '#/components/schemas/PartialWellRerunDatasetProgress'
      example:
