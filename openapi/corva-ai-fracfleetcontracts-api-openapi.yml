components:
  schemas:
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    FracFleetContract:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            current:
              type: boolean
            data:
              type: object
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
      example:
        id: 123
        type: frac_fleet_contract
        attributes:
          id: 123
          current: true
          data:
            key: value
            another_key: another_value
          created_at: '2020-01-01T08:00:00.000Z'
          updated_at: '2020-01-01T08:00:00.000Z'
    FracFleetContractUpdatePayload:
      properties:
        frac_fleet_contract:
          type: object
          properties:
            current:
              type: boolean
            data:
              type: object
      example:
        frac_fleet_contract:
          current: true
          data:
            key: value
            another_key: another_value
    FracFleetContractCreatePayload:
      properties:
        frac_fleet_contract:
          type: object
          properties:
            current:
              type: boolean
            data:
              type: object
      example:
        frac_fleet_contract:
          current: true
          data:
            key: value
            another_key: another_value
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
