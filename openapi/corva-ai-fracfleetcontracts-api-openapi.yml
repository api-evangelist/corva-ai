        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created Frac Fleet Contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FracFleetContract'
      parameters:
      - in: path
        name: frac_fleet_id
        description: Frac Fleet ID
        schema:
          type: integer
          format: int64
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FracFleetContractCreatePayload'
        description: Frac Fleet Contract Payload
        required: true
      operationId: postV2FracFleetsByFracFleetIdFracFleetContracts
      x-operation-id-source: derived
