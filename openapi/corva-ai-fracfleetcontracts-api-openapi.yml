security:
- api_key: []
tags:
- name: FracFleetContracts
paths:
  /v2/frac_fleets/{frac_fleet_id}/frac_fleet_contracts:
    get:
      summary: List Company Goals if no filters applied
      tags:
      - FracFleetContracts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List of Frac Fleet Contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FracFleetContract'
      parameters:
      - in: path
        name: frac_fleet_id
        description: Frac Fleet ID
        schema:
          type: integer
          format: int64
        required: true
      - in: query
        name: per_page
        description: Number of items to list per page
        schema:
          type: integer
      - in: query
        name: page
        description: Number of page
        schema:
          type: integer
      operationId: getV2FracFleetsByFracFleetIdFracFleetContracts
      x-operation-id-source: derived
    post:
      summary: Create Frac Fleet Contract
      tags:
