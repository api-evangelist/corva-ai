openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Assets API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Assets
  description: 'Manage company assets: Programs, Pads, Rigs, Wells, Frac Fleets, and Wirelines'
paths:
  /v2/favorites:
    get:
      summary: List favorites
      tags:
      - Assets
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List user favorites
          content:
            application/json:
              schema:
                properties:
                  programs:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Program'
                  rigs:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Rig'
                  wells:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Well'
                  pads:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Pad'
                  frac_fleets:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FracFleet'
                  drillout_units:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DrilloutUnit'
                  wirelines:
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Wireline'
      parameters:
      - in: query
        name: fields
        description: 'Filter response fields, example: fields=rig.name,rig.active_well,well.name'
        schema:
          type: string
      description: Returns all of the favorites that are saved in a user's settings.favorites key.
      operationId: getV2Favorites
      x-operation-id-source: derived
  /v2/assets:
    get:
      summary: List assets
      tags:
      - Assets
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
      parameters:
      - in: query
        name: types
        description: List of asset types
        schema:
          type: string
          items:
            type: string
          enum:
          - program
          - rig
          - well
      - in: query
        name: status
        description: Search by asset status (wells only; status is null for other asset types)
        schema:
          type: string
          enum:
          - active
          - idle
          - paused
          - complete
          - deleting
      - in: query
        name: visibility
        description: Search by asset visibility
        schema:
          type: string
          enum:
          - visible
          - visible_to_admin
          - deleted
      - in: query
        name: ids
        description: List of asset IDs to filter by
        schema:
          items:
            type: integer
      - in: query
        name: program
        description: Search by Program ID
        schema:
          type: integer
      - in: query
        name: parent_asset_id
        description: Search by parent asset ID
        schema:
          type: integer
      - in: query
        name: api_number
        description: Search by one API number or multiple API numbers using api_number[] or comma-separated values; dashes are ignored
        schema:
          type: string
      - in: query
        name: search
        description: Search by asset ID, asset name, api_number or customer_well_id
        schema:
          type: string
      - in: query
        name: start
        description: Search by start time as a Unix timestamp
        schema:
          type: integer
          format: timestamp
      - in: query
        name: end
        description: Search by end time as a Unix timestamp
        schema:
          type: integer
          format: timestamp
      - in: query
        name: long_start
        description: Search by lon_lat coordinate area
        schema:
          type: float
      - in: query
        name: long_end
        description: Search by lon_lat coordinate area
        schema:
          type: float
      - in: query
        name: lat_start
        description: Search by lon_lat coordinate area
        schema:
          type: float
      - in: query
        name: lat_end
        description: Search by lon_lat coordinate area
        schema:
          type: float
      - in: query
        name: company_id
        description: Search by Company ID
        schema:
          type: integer
      - in: query
        name: api_number
        description: Search by one API number or multiple API numbers using api_number[] or comma-separated values; dashes are ignored
        schema:
          type: string
      - in: query
        name: fields
        description: Respond with only the given list of fields, like asset.asset_type. See example response for fields.
        schema:
          items:
            type: string
      - in: query
        name: per_page
        description: Number of items to list per page
        schema:
          type: integer
      - in: query
        name: sort
        description: 'One or more fields to sort by. Prefix with a - for descending order. Ex: name,-last_active_at'
        schema:
          type: string
          enum:
          - name
          - last_active_at
          - status
          - rig
          - program
          - well
          - company
          - well_end
      - in: query
        name: order
        description: A sorting direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - in: query
        name: range_filter_field
        description: Filtering datetime with start/end
        schema:
          type: string
      - in: query
        name: active_before
        description: Return records where last_active_at is smaller than the given timestamp
        schema:
          type: datetime
      - in: query
        name: active_after
        description: Return records where last_active_at is greater than or equal to the given timestamp
        schema:
          type: datetime
      - in: query
        name: last_active_drilling_before
        description: Return records where last_drilling_at is smaller than the given timestamp
        schema:
          type: datetime
      - in: query
        name: last_active_drilling_after
        description: Return records where last_drilling_at is greater than or equal to the given timestamp
        schema:
          type: datetime
      - in: query
        name: include_rig_id
        description: Add rig_id to response(only works with Asset::Rig)
        schema:
          type: boolean
      - in: query
        name: include_type_wells
        description: Add type wells to response(only works with Asset::Well)
        schema:
          type: boolean
      - in: query
        name: include_intervention_units
        description: Add intervention units to response
        schema:
          type: boolean
      - in: query
        name: polygon_coords
        description: Filter by assets within a polygon defined by an array of coordinate points. Minimum 3 points required. The polygon will be automatically closed.
        schema:
          items:
            type: object
            properties:
              latitude:
                type: float
                description: Latitude coordinate of the polygon point
              longitude:
                type: float
                description: Longitude coordinate of the polygon point
          example:
            value:
            - latitude: 29.0
              longitude: -96.0
            - latitude: 31.0
              longitude: -96.0
            - latitude: 31.0
              longitude: -94.0
            - latitude: 29.0
              longitude: -94.0
      operationId: getV2Assets
      x-operation-id-source: derived
  /v2/assets/{id}:
    get:
      summary: Get asset by ID
      tags:
      - Assets
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Show asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
      parameters:
      - in: path
        name: id
        description: Asset ID
        schema:
          type: integer
        required: true
      - in: query
        name: fields
        description: Respond with only the given list of fields, like asset.asset_type
        schema:
          items:
            type: string
      operationId: getV2AssetsById
      x-operation-id-source: derived
  /v2/assets/{id}/settings:
    get:
      summary: Get asset settings
      tags:
      - Assets
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Asset settings, merged with optional connection settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
      parameters:
      - in: path
        name: id
        description: Asset ID
        schema:
          type: integer
        required: true
      - in: query
        name: app_key
        description: App Key
        schema:
          type: string
      - in: query
        name: segment
        description: Used with app_key
        schema:
          type: string
          enum:
          - drilling
          - completion
          - intervention
          default: drilling
      - in: query
        name: source_type
        description: Used with app_key
        schema:
          type: string
          enum:
          - drilling
          - drillout
          - frac
          - pumpdown
          - wireline
          default: drilling
      - in: query
        name: log_type
        description: Used with source_type and app_key
        schema:
          type: string
          enum:
          - time
          - depth
          default: time
      - in: query
        name: app_connection_id
        description: App Connection ID
        schema:
          type: integer
      - in: query
        name: app_stream_id
        description: App Stream ID, used with app_key
        schema:
          type: integer
      operationId: getV2AssetsByIdSettings
      x-operation-id-source: derived
