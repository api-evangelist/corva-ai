openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva App Store Templates API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: AppStoreTemplates
paths:
  /v2/app_store_templates:
    get:
      summary: List AppStoreTemplates
      tags:
      - AppStoreTemplates
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreTemplateList'
      parameters:
      - in: query
        name: page
        description: Number of page
        schema:
          type: integer
      - in: query
        name: per_page
        description: Number of items to list per page
        schema:
          type: integer
      - in: query
        name: sort
        description: 'One or more fields to sort by. Prefix with a - for descending order. Ex: name,-updated_at'
        schema:
          type: string
          enum:
          - title
          - status
          - created_at
          - updated_at
      - in: query
        name: order
        description: A sorting direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - in: query
        name: view_type
        description: Filter by view_type
        schema:
          type: string
          enum:
          - drilling
          - discover
          - completion
          - geoscience
      operationId: getV2AppStoreTemplates
      x-operation-id-source: derived
    post:
      summary: Create a AppStoreTemplate
      tags:
      - AppStoreTemplates
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created AppStoreTemplate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreTemplateObject'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppStoreTemplatePayload'
        description: AppStoreTemplate Payload
        required: true
      operationId: postV2AppStoreTemplates
      x-operation-id-source: derived
  /v2/app_store_templates/{id}:
    get:
      summary: Show AppStoreTemplate
      tags:
      - AppStoreTemplates
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreTemplateObject'
      parameters:
      - in: path
        name: id
        description: AppStoreTemplate ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2AppStoreTemplatesById
      x-operation-id-source: derived
    patch:
      summary: Update a AppStoreTemplate
      tags:
      - AppStoreTemplates
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated AppStoreTemplate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppStoreTemplateObject'
      parameters:
      - in: path
        name: id
        description: AppStoreTemplate ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppStoreTemplateObject'
        description: AppStoreTemplate Payload
        required: true
      operationId: patchV2AppStoreTemplatesById
      x-operation-id-source: derived
    delete:
      summary: Delete a AppStoreTemplate
      tags:
      - AppStoreTemplates
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: AppStoreTemplate deleted
      parameters:
      - in: path
        name: id
        description: AppStoreTemplate ID
        required: true
        schema:
          type: integer
      operationId: deleteV2AppStoreTemplatesById
      x-operation-id-source: derived
components:
  schemas:
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    AppStoreTemplatePayload:
      properties:
        app_store_template:
          type: object
          properties:
            title:
              type: string
            status:
              type: string
      example:
        app_store_template:
          title: New title
          status: draft
          view_type: drilling
    AppStoreTemplateList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppStoreTemplateObject'
        included:
          type: array
          items:
            properties:
              id:
                type: integer
              type:
                type: string
              attributes:
                type: object
      example:
        data:
        - id: 12345
          type: app_store_template
          attributes:
            id: 12345
            title: AppStore Template
            status: draft
            view_type: drilling
            created_at: '2022-11-11T09:11:52.326Z'
            updated_at: '2022-11-11T09:11:52.326Z'
          relationships:
            app_store_template_sections:
              data:
              - id: 12456
                type: app_store_template_section
              - id: 345
                type: app_store_template_section
        included:
        - id: 348
          type: app_store_template_section
          attributes:
            id: 348
            title: Title
            section_type: slide
            position: 1
    AppStoreTemplateObject:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
            status:
              type: string
            view_type:
              type: string
            created_at:
              type: string
              format: date-time
            updated:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            app_store_template_sections:
              type: object
              properties:
                data:
                  type: array
                  items:
                    properties:
                      id:
                        type: integer
                      type:
                        type: string
      example:
        id: 12345
        type: app_store_template
        attributes:
          id: 12345
          title: AppStore Template
          status: draft
          view_type: drilling
          created_at: '2022-11-11T09:11:52.326Z'
          updated_at: '2022-11-11T09:11:52.326Z'
        relationships:
          app_store_template_sections:
            data:
            - id: 12345
              type: app_store_template_section
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
