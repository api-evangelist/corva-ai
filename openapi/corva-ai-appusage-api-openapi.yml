openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva App Usage API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: AppUsage
paths:
  /v2/usage_analytics/app_usage:
    get:
      summary: Get Total App Usage Statistics
      tags:
      - AppUsage
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalAppUsageList'
      parameters:
      - in: query
        name: group_by
        description: Group results by some columns
        required: false
        schema:
          type: string
          enum:
          - app_name
          - user_id
          - well_id
          - rig_id
          - pad_id
          - fleet_id
          - drillout_unit_id
      - in: query
        name: segment
        description: Filter by segment
        required: false
        schema:
          type: string
      - in: query
        name: company_id
        description: Filter by company_id
        schema:
          type: integer
      - in: query
        name: user_email
        description: Filter by user_email (accepts only full email)
        schema:
          type: string
      - in: query
        name: program_id
        description: Filter by program_id
        schema:
          type: array
      - in: query
        name: asset_id
        description: Filter by asset_id
        schema:
          type: array
      - in: query
        name: well_id
        description: Filter by well_id
        schema:
          type: array
      - in: query
        name: pad_id
        description: Filter by pad_id
        schema:
          type: array
      - in: query
        name: fleet_id
        description: Filter by fleet_id
        schema:
          type: array
      - in: query
        name: rig_id
        description: Filter by rig_id
        schema:
          type: array
      - in: query
        name: drillout_unit_id
        description: Filter by drillout_unit_id
        schema:
          type: array
      - in: query
        name: device_family
        description: Filter by device_family
        schema:
          type: array
      - in: query
        name: os_family
        description: Filter by os_family
        schema:
          type: array
      - in: query
        name: useragent_family
        description: Filter by useragent_family
        schema:
          type: array
      - in: query
        name: corva_v3
        description: Filter by corva_v3
        schema:
          type: boolean
      - in: query
        name: corva_next
        description: Filter by corva_next (iOS app)
        schema:
          type: boolean
      - in: query
        name: user_group
        description: Filter by user_group emails
        schema:
          type: string
          enum:
          - corva
          - clients
      - in: query
        name: device_type
        description: Filter by device_type
        schema:
          type: string
          enum:
          - web
          - web3
          - corva_next
      - in: query
        name: start
        description: Search by start time as a Unix timestamp
        schema:
          type: integer
          format: timestamp
      - in: query
        name: end
        description: Search by end time as a Unix timestamp
        schema:
          type: integer
          format: timestamp
      operationId: getV2UsageAnalyticsAppUsage
      x-operation-id-source: derived
  /v2/usage_analytics/app_usage/usage_list:
    get:
      summary: Get App Usage Statistics by user
      tags:
      - AppUsage
      responses:
        '401':
          description: Authentication error
