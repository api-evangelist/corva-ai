components:
  schemas:
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    AppUsageTopAppsList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppUsageTopApps'
      example:
        data:
        - id: 12345
          type: app_usage
          attributes:
            id: f89c
            app_name: Corva Real-Time Traces
            event_sum: 12345
            view_date: '2023-08-24'
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    AppUsageByUser:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: string
            app_name:
              type: string
            event_sum:
              type: integer
            user_id:
              type: integer
            user_name:
              type: string
            user_email:
              type: string
            company_name:
              type: string
      example:
        id: 12345
        type: app_usage
        attributes:
          id: f89c
          app_name: Corva Real-Time Traces
          event_sum: 12345
          user_id: 12345
          user_name: John Doe
          user_email: example@email.com
          company_name: Nova Poshta
    AppUsageByUserList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppUsageByUser'
      example:
        data:
        - id: 12345
          type: app_usage
          attributes:
            id: f89c
            app_name: Corva Real-Time Traces
            event_sum: 12345
            user_id: 12345
            user_name: John Doe
            user_email: example@email.com
            company_name: Nova Poshta
    TotalAppUsageList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TotalAppUsage'
      example:
        data:
        - id: 12345
          type: app_usage
          attributes:
            id: f89c
            app_name: Corva Real-Time Traces
            device_family: Mac
            os_family: Mac OS X
            useragent_family: Chrome
            event_sum: 12345
            user_email: example@example.com
            user_id: 123
            user_mobile: '+11234567890'
            user_name: John Doe
            user_profile_photo: https://s3-path-to-photo
            user_title: Engineer
            user_group: RTOC
    TotalAppUsage:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: string
            app_name:
              type: string
            device_family:
              type: string
            os_family:
              type: string
            useragent_family:
              type: string
            corva_next:
              type: boolean
            event_sum:
              type: integer
            user_email:
              type: string
            user_id:
              type: integer
            user_mobile:
              type: string
            user_name:
              type: string
            user_profile_photo:
              type: string
            user_group:
              type: string
            user_title:
              type: string
    AppUsageByViewDateList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppUsageByViewDate'
      example:
        data:
        - id: 12345
          type: app_usage
          attributes:
            id: f89c
            app_name: Corva Real-Time Traces
            event_sum: 12345
            view_date: '2023-08-24'
            user_id: 123
            user_name: John Doe
            user_email: example@example.com
            user_profile_photo: https://s3-path-to-photo
            user_title: Engineer
            user_mobile: '+11234567890'
    AppUsageByViewDate:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: string
            app_name:
              type: string
            event_sum:
              type: integer
            user_email:
              type: string
            user_id:
              type: integer
            user_mobile:
              type: string
            user_name:
              type: string
            user_profile_photo:
              type: string
            user_title:
              type: string
            view_date:
              type: string
    AppUsageTopApps:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: string
            app_name:
              type: string
            event_sum:
              type: integer
            view_date:
              type: string
      example:
        id: 12345
        type: app_usage
        attributes:
          id: '12_345'
          app_name: Corva Real-Time Traces
          event_sum: 12345
          view_date: '2023-08-24'
    TotalAppUsageTrend:
      properties:
        data:
          type: array
          items:
            properties:
              id:
                type: integer
                format: int64
              type:
                type: string
              attributes:
                type: object
                properties:
                  id:
                    type: string
                  event_sum:
                    type: integer
                  view_date:
                    type: string
      example:
        data:
        - id: null
          type: app_usage
          attributes:
            id: null
            event_sum: 12345
            view_date: '2023-08-24'
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
