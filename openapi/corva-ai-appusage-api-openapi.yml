        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUsageByUserList'
      parameters:
      - in: query
        name: app_name
        description: Filter by app name
        required: true
        schema:
          type: string
      - in: query
        name: start
        description: Search by start time as a Unix timestamp
        schema:
          type: integer
          format: timestamp
      - in: query
        name: end
        description: Search by end time as a Unix timestamp
        schema:
          type: integer
          format: timestamp
      - in: query
        name: company_id
        description: Filter by company_id
        schema:
          type: integer
      - in: query
        name: user_email
        description: Filter by user_email (accepts only full email)
        schema:
          type: string
      - in: query
        name: program_id
        description: Filter by program_id
        schema:
          type: array
      - in: query
        name: asset_id
        description: Filter by asset_id
        schema:
          type: array
      - in: query
        name: well_id
        description: Filter by well_id
        schema:
          type: array
      - in: query
        name: pad_id
        description: Filter by pad_id
        schema:
          type: array
      - in: query
        name: fleet_id
        description: Filter by fleet_id
        schema:
          type: array
      - in: query
        name: rig_id
        description: Filter by rig_id
        schema:
          type: array
      - in: query
        name: drillout_unit_id
        description: Filter by drillout_unit_id
        schema:
          type: array
      - in: query
        name: device_type
        description: Filter by device_type
        schema:
          type: string
          enum:
          - web
          - web3
          - corva_next
      - in: query
        name: sort
        description: 'One or more fields to sort by. Prefix with a - for descending order. Ex: -event_sum'
        schema:
          type: string
          enum:
          - event_sum
      - in: query
        name: order
        description: A sorting direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - in: query
        name: page
        description: Number of page
        schema:
          type: integer
      - in: query
        name: per_page
        description: Number of items to list per page
        schema:
          type: integer
      operationId: getV2UsageAnalyticsAppUsageUsageList
      x-operation-id-source: derived
