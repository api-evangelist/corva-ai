openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva App Types API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: AppTypes
paths:
  /v2/app_types:
    get:
      summary: List AppTypes
      tags:
      - AppTypes
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTypeList'
      operationId: getV2AppTypes
      x-operation-id-source: derived
  /v2/app_types/{id}:
    get:
      summary: Show AppType
      tags:
      - AppTypes
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppType'
      parameters:
      - in: path
        name: id
        description: AppType ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2AppTypesById
      x-operation-id-source: derived
    patch:
      summary: Update an AppType
      tags:
      - AppTypes
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated AppType
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppType'
      parameters:
      - in: path
        name: id
        description: AppType ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTypePayload'
        description: AppType Payload
        required: true
      operationId: patchV2AppTypesById
      x-operation-id-source: derived
components:
  schemas:
    AppTypeList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppType'
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    AppTypePayload:
      properties:
        doc_intro:
          type: string
        doc_description:
          type: string
        doc_content:
          type: string
    AppType:
      properties:
        identifier:
          type: string
        name:
          type: string
        group:
          type: string
        doc_intro:
          type: string
        doc_description:
          type: string
        doc_content:
          type: string
      example:
        id: 12345
        type: app_type
        attributes:
          id: 12345
          identifier: scheduler
          name: Polling App Scheduler
          group: backend
          doc_intro: '[{''type'':''paragraph'',''children'':[{''text'':''These are the Backend apps...''}]}]'
          doc_description: '[{''type'':''paragraph'',''children'':[{''text'':''These are the Backend apps...''}]}]'
          doc_content: '[{''type'':''paragraph'',''children'':[{''text'':''These are the Backend apps...''}]}]'
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
