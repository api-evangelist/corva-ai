components:
  schemas:
    DatasetAuditList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DatasetAudit'
      example:
        data:
        - id: 12345
          type: dataset_audit
          attributes:
            id: 12345
            action: create
            user_email: example@corva.com
            name: provider#dataset-name
            description: Description of the dataset
            data_type: time
            plottable: false
            schema: {}
            permission_workflow:
            - read
            - write
            - delete
            created_at: '2022-11-11T09:11:52.326Z'
          relationships:
            company:
              data:
                id: 12345
                type: company
    GroupMembershipAuditIndex:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
