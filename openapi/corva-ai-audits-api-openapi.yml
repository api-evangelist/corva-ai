openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Audits API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Audits
paths:
  /v2/dataset_audits:
    get:
      summary: List Dataset Audits
      tags:
      - Audits
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetAuditList'
      parameters:
      - in: query
        name: action_name
        description: Search by action
        schema:
          type: string
      - in: query
        name: user_email
        description: Searches by user email
        schema:
          type: string
      - in: query
        name: start
        description: Filter by event time (Unix timestamp)
        schema:
          type: integer
          format: timestamp
      - in: query
        name: end
        description: Filter by event time (Unix timestamp)
        schema:
          type: integer
          format: timestamp
      - in: query
        name: permission_workflow
        description: Filter by Permission column
        schema:
          type: string
          enum:
          - read
          - write
          - read_and_write
          - delete
      - in: query
        name: name
        description: Searches by dataset name
        schema:
          type: string
      - in: query
        name: company_id
        description: Filter by company
        schema:
          type: integer
      - in: query
        name: data_type
        description: Filter by data_type
        schema:
          type: string
      - in: query
        name: sort
        description: 'One or more fields to sort by. Prefix with a - for descending order. Ex: action, -created_at'
        schema:
          type: string
          enum:
          - action
          - created_at
      - in: query
        name: order
        description: A sorting direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      operationId: getV2DatasetAudits
      x-operation-id-source: derived
