            action:
              type: string
            user_email:
              type: string
            comment:
              type: string
            target_user_email:
              type: string
            target_user_name:
              type: string
            group_name:
              type: string
            group_id:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            company:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                    type:
                      type: string
      example:
        id: 12345
        type: group_membership_audit
        attributes:
          id: 12345
          action: add
          user_email: admin@corva.com
          comment: null
          target_user_email: user@corva.com
          target_user_name: John Doe
          group_name: admin
