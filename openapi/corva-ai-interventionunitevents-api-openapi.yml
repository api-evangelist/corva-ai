openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Intervention Unit Events API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: InterventionUnitEvents
paths:
  /v2/intervention_unit_events:
    get:
      summary: Get a list of Intervention Units Events by well
      tags:
      - InterventionUnitEvents
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      parameters:
      - in: query
        name: operation
        description: Filter by operation
        schema:
          type: string
      - in: query
        name: well_id
        description: Filter by well_id
        schema:
          type: integer
      - in: query
        name: per_page
        description: Number of intervention unit events per page
        schema:
          type: integer
      - in: query
        name: page
        description: Number of page
        schema:
          type: integer
      - in: query
        name: sort
        description: 'One or more fields to sort by. Prefix with a - for descending order. Ex: operation,created_at'
        schema:
          type: string
          enum:
          - operation
          - created_at
          - well
          - intervention_unit
          - last_active_at
          default: -created_at
      - in: query
        name: order
        description: A sorting direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      operationId: getV2InterventionUnitEvents
      x-operation-id-source: derived
  /v2/wells/{well_id}/intervention_unit_events:
    post:
      summary: Create an Intervention Unit Event
      tags:
      - InterventionUnitEvents
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created Intervention Unit Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterventionUnitEvent'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInterventionUnitEventPayload'
        description: Intervention Unit Event Payload
        required: true
      operationId: postV2WellsByWellIdInterventionUnitEvents
      x-operation-id-source: derived
  /v2/intervention_unit_events/{id}:
    patch:
      summary: Update Intervention Unit Event
      tags:
      - InterventionUnitEvents
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated Intervention Unit Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterventionUnit'
      parameters:
      - in: path
        name: id
        description: Intervention Unit Event ID
        schema:
          type: integer
          format: int64
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInterventionUnitEventPayload'
        description: Intervention Unit Event Payload
        required: true
      operationId: patchV2InterventionUnitEventsById
      x-operation-id-source: derived
    delete:
      summary: Delete Intervention Unit Event
      tags:
      - InterventionUnitEvents
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Deleted Intervention Unit Event
          content:
            application/json:
              schema:
                example:
                  status: deleted
      parameters:
      - in: path
        name: id
        description: Intervention Unit Event ID
        schema:
          type: integer
          format: int64
        required: true
      operationId: deleteV2InterventionUnitEventsById
      x-operation-id-source: derived
components:
  schemas:
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    InterventionUnitEvent:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            operation:
              type: string
            integration_id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            relationships:
              type: object
              properties:
                intervention_unit:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        type:
                          type: string
                well:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        type:
                          type: string
      example:
        id: 111
        type: intervention_unit_event
        attributes:
          operation: operation
          integration_id: 32959483F393D
          created_at: '2010-01-01T00:00:00.000Z'
          updated_at: '2010-01-01T00:00:00.000Z'
        relationships:
          program:
            data:
              id: '333'
              type: intervention_unit
          company:
            data:
              id: '222'
              type: well
    UpdateInterventionUnitEventPayload:
      properties:
        operation:
          type: string
        set_at:
          type: string
          format: date-time
        start_at:
          type: string
          format: date-time
        release_at:
          type: string
          format: date-time
        integration_id:
          type: string
      example:
        operation: operation
        integration_id: 32959483F393D
        set_at: '2010-01-01T00:00:00.000Z'
        start_at: '2010-01-01T00:00:00.000Z'
        release_at: '2010-01-01T00:00:00.000Z'
    CreateInterventionUnitEventPayload:
      properties:
        intervention_unit_id:
          type: integer
        operation:
          type: string
        integration_id:
          type: string
        set_at:
          type: string
          format: date-time
        start_at:
          type: string
          format: date-time
        release_at:
          type: string
          format: date-time
      example:
        intervention_id: 123
        operation: operation
        integration_id: 32959483F393D
        set_at: '2010-01-01T00:00:00.000Z'
        start_at: '2010-01-01T00:00:00.000Z'
        release_at: '2010-01-01T00:00:00.000Z'
    InterventionUnit:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            intervention_type:
              type: string
            name:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            relationships:
              type: object
              properties:
                program:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        type:
                          type: string
                company:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        type:
                          type: string
      example:
        id: 111
        type: intervention_unit
        attributes:
          name: Intervention
          intervention_type: workover
          created_at: '2010-01-01T00:00:00.000Z'
          updated_at: '2010-01-01T00:00:00.000Z'
        relationships:
          program:
            data:
              id: '333'
              type: program
          company:
            data:
              id: '222'
              type: company
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
