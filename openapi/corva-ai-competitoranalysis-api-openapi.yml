              median: 89.47059
              q1: 89.47059
              q3: 89.47059
            drilling_connection_average:
              min: 132.50789
              max: 146.54971
              median: 139.5288
              q1: 139.5288
              q3: 143.039255
            weight_to_weight_average:
              min: 239.8053
