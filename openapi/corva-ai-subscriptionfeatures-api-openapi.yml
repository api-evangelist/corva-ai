openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Subscription Features API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: SubscriptionFeatures
paths:
  /v2/subscription_features:
    get:
      summary: List Subscription Features
      tags:
      - SubscriptionFeatures
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionFeatureList'
      operationId: getV2SubscriptionFeatures
      x-operation-id-source: derived
  /v2/subscription_features/{id}:
    get:
      summary: Show Subscription Feature
      tags:
      - SubscriptionFeatures
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionFeature'
      parameters:
      - in: path
        name: id
        description: Subscription Feature ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2SubscriptionFeaturesById
      x-operation-id-source: derived
components:
  schemas:
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    SubscriptionFeatureList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionFeature'
    SubscriptionFeature:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            title:
              type: string
            name:
              type: string
            value_type:
              type: string
            asset_type:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
      example:
        id: 12345
        type: subscription_feature
        attributes:
          id: 12345
          title: API Access
          name: api_access
          value_type: boolean
          asset_type: program
          created_at: '2010-01-01T00:00:00.000Z'
          updated_at: '2010-01-01T00:00:00.000Z'
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
