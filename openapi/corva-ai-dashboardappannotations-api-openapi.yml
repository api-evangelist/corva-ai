      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: comment_id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2DashboardAppAnnotationsByAppAnnotationIdCommentsByCommentIdLikes
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/{app_annotation_id}/comments/{comment_id}/likes/toggle:
    post:
      summary: Toggle a like for app annotation's comment
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
