openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Dashboard App Annotations API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: DashboardAppAnnotations
  description: Manage annotations to applications on user dashboards
paths:
  /v2/dashboard_app_annotations/{app_annotation_id}/comments/:
    get:
      summary: List comments for app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: per_page
        description: Number of items to list per page
        schema:
          type: integer
      - in: query
        name: page
        description: Number of page
        schema:
          type: integer
      - in: query
        name: offset
        description: Offset for pagination
        schema:
          type: integer
      operationId: getV2DashboardAppAnnotationsByAppAnnotationIdComments
      x-operation-id-source: derived
    post:
      summary: Create a comment for app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created app annotation comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPayload'
        description: Comment Payload
        required: true
      operationId: postV2DashboardAppAnnotationsByAppAnnotationIdComments
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/{app_annotation_id}/comments/{id}:
    get:
      summary: Show comment for app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2DashboardAppAnnotationsByAppAnnotationIdCommentsById
      x-operation-id-source: derived
    patch:
      summary: Update an app annotation comment
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated app annotation comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPayload'
        description: Comment Payload
        required: true
      operationId: patchV2DashboardAppAnnotationsByAppAnnotationIdCommentsById
      x-operation-id-source: derived
    delete:
      summary: Delete an app annotation comment
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: App Annotation comment deleted
      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: deleteV2DashboardAppAnnotationsByAppAnnotationIdCommentsById
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/{app_annotation_id}/comments/{comment_id}/likes:
    get:
