                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created/deleted alert app annotation
      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: comment_id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: postV2DashboardAppAnnotationsByAppAnnotationIdCommentsByCommentIdLikesToggle
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/{app_annotation_id}/likes:
    get:
      summary: List likes for app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
