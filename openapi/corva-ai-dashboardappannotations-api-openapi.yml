        schema:
          type: integer
          format: int64
      - in: query
        name: asset_id
        description: Asset ID
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: parent_asset_id
        description: Parent Asset ID
        required: false
        schema:
          type: integer
          format: int64
      operationId: getV2DashboardAppAnnotationsLastAnnotations
      x-operation-id-source: derived
components:
  schemas:
    DashboardAppWithLastAnnotation:
      properties:
        id:
          type: integer
          format: int64
        last_annotation:
          type: object
          $ref: '#/components/schemas/DashboardAppAnnotation'
    NotFoundError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 404
        message: Not found
    AuthorizationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 403
        message: Access denied
    DashboardAppAnnotationList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DashboardAppAnnotation'
        included:
          type: array
          items:
            $ref: '#/components/schemas/UserMinimal'
    AuthenticationError:
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
        code: 401
        message: Missing authentication. Please try again.
    CommentPayload:
      properties:
        comment:
          type: object
          properties:
            body:
              type: string
            attachment:
              type: object
              properties:
                file_name:
                  type: string
                s3_link:
                  type: string
            attachments:
              type: array
              items:
                properties:
                  file_name:
                    type: string
                  s3_link:
                    type: string
      example:
        comment:
          body: Hey @[user:57689|Derek]
          attachments:
          - file_name: report.pdf
            s3_link: some_s3_link
    UserMinimal:
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            title:
              type: string
            role:
              type: string
            profile_photo:
              type: string
            terms_acceptance_at:
              type: string
              format: date-time
            messaging_id:
              type: string
            company_id:
              type: integer
              format: int64
            mobile:
              type: string
            last_sign_in_at:
              type: string
              format: date-time
            current_segment:
              type: string
            created_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            groups:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
            company:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
        included:
          type: array
          items:
            properties:
              id:
                type: integer
              type:
                type: string
              attributes:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
      example:
        id: 2499
        type: user
        attributes:
          first_name: Derek
          last_name: Smith
          email: email7@corva.ai
          title: Drilling Engineer
          role: User role
          profile_photo: aws_s3_file_path
          terms_acceptance_at: '2020-02-04T12:48:59.593Z'
          messaging_id: test_13684
          company_id: 123
          mobile: Mobile string
          last_sign_in_at: '2020-02-04T12:48:59.593Z'
          current_segment: drilling
          created_at: '2020-02-04T12:48:59.593Z'
        relationships:
          groups:
            data:
            - id: 123
              type: group
            - id: 124
              type: group
          company:
            data:
              id: 123
              type: company
        included:
        - id: 123
          type: group
          attributes:
            id: 123
            name: Group name
        - id: 123
          type: company
          attributes:
            id: 123
            name: Company name
    Comment:
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
        body:
          type: string
        attachment:
          type: object
          properties:
            file_name:
              type: string
            s3_link:
              type: string
        attachments:
          type: array
          items:
            properties:
              file_name:
                type: string
              s3_link:
                type: string
        created_at:
          type: string
          format: date-time
        mentioned_users:
          type: array
          items:
            $ref: '#/components/schemas/V1UserMinimal'
        likes_count:
          type: integer
        user:
          type: object
          $ref: '#/components/schemas/V1UserMinimal'
        likes:
          type: array
          items:
            $ref: '#/components/schemas/Like'
    DashboardAppAnnotationUpdatePayload:
      properties:
        app_annotation:
          type: object
          properties:
            body:
              type: text
            active_until:
              type: string
              format: date-time
            attachment:
              type: object
      example:
        app_annotation:
          body: My App Annotation
          active_until: Wed, 29 Jan 2020 19:11:00 +0000
          attachment:
            file_name: report.pdf
            s3_link: some_s3_link
    DashboardAppAnnotation:
      required:
      - id
      - body
      - asset_id
      - app_id
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        attributes:
          type: object
          properties:
            id:
              type: integer
              format: int64
            body:
              type: text
            active_until:
              type: string
              format: date-time
            comments_count:
              type: integer
            asset_id:
              type: integer
              format: int64
            app_id:
              type: integer
              format: int64
            attachment:
              type: object
            company_id:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            user:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
            mentioned_users:
              type: array
              items:
