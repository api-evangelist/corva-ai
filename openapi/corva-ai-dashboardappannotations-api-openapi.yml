        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Like'
      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2DashboardAppAnnotationsByAppAnnotationIdLikes
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/{app_annotation_id}/likes/toggle:
    post:
      summary: Toggle a like for app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created/deleted app annotation like
      parameters:
      - in: path
        name: app_annotation_id
        description: App Annotation ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: postV2DashboardAppAnnotationsByAppAnnotationIdLikesToggle
      x-operation-id-source: derived
  /v2/dashboard_app_annotations:
    get:
      summary: List annotations for app-asset combination
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAppAnnotationList'
      parameters:
      - in: query
        name: active
        description: Set to true to return active annotations, false - to return not active annotations
        schema:
          type: boolean
      - in: query
        name: asset_id
        description: Asset ID
        schema:
          type: integer
          format: int64
      - in: query
        name: app_id
        description: App ID
        schema:
          type: integer
          format: int64
      - in: query
        name: user_id
        description: Filter by user ID
        schema:
          type: integer
          format: int64
      - in: query
        name: user_email
        description: Filter by user email
        schema:
          type: string
      operationId: getV2DashboardAppAnnotations
      x-operation-id-source: derived
    post:
      summary: Create an app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created app annotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAppAnnotationSingle'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardAppAnnotationPayload'
        description: Annotation Payload
        required: true
      operationId: postV2DashboardAppAnnotations
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/{id}:
    get:
      summary: Show app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAppAnnotationSingle'
      parameters:
      - in: path
        name: id
        description: DashboardAppAnnotation ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2DashboardAppAnnotationsById
      x-operation-id-source: derived
    patch:
      summary: Update an app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated app annotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAppAnnotationSingle'
      parameters:
      - in: path
        name: id
        description: DashboardAppAnnotation ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardAppAnnotationUpdatePayload'
        description: Annotation Payload
        required: true
      operationId: patchV2DashboardAppAnnotationsById
      x-operation-id-source: derived
    delete:
      summary: Delete an app annotation
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: App annotation deleted
      parameters:
      - in: path
        name: id
        description: DashboardAppAnnotation ID
        required: true
        schema:
          type: integer
      operationId: deleteV2DashboardAppAnnotationsById
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/{id}/close:
    get:
      summary: Closes app annotation for curent user, returns new last annotation for user and…
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAppAnnotationSingle'
      parameters:
      - in: path
        name: id
        description: DashboardAppAnnotation ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2DashboardAppAnnotationsByIdClose
      x-operation-id-source: derived
  /v2/dashboard_app_annotations/last_annotations:
    get:
      summary: Returns last app annotations for current user and dashboard or dashboard-asset…
      tags:
      - DashboardAppAnnotations
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
