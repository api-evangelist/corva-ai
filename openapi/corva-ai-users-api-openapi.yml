                  id:
                    type: string
                  email:
                    type: integer
                  streak:
                    type: object
                    properties:
                      current_streak:
                        type: integer
                      longest_streak:
                        type: integer
                      last_active_on:
                        type: date
      example:
        data:
        - id: '1'
          type: user
          attributes:
            id: 1
            email: example@email.com
            streak:
              current_streak: 1
              longest_streak: 10
              last_active_on: '2025-04-25'
    Auth0Authentication:
      properties:
        token:
          type: string
        nonce:
          type: string
      example:
        auth:
          token: auth0-token-goes-here
          nonce: auth0-nonce-goes-here
    EmailPasswordAuthentication:
      properties:
        email:
          type: string
        password:
          type: string
      example:
        auth:
          email: me@mycompany.com
          password: ThisIsMyP@55w0rd!
    JwksKey:
      description: JWKS public key for JWT token verification
      properties:
        kid:
          type: string
          description: Key ID
        kty:
          type: string
          description: Key type (RSA)
        alg:
          type: string
          description: Algorithm (RS256)
        use:
          type: string
          description: Key usage (sig for signature)
        n:
          type: string
          description: Base64url-encoded RSA modulus
        e:
          type: string
          description: Base64url-encoded RSA exponent
      example:
        kid: corva-api-1731540000
        kty: RSA
        alg: RS256
        use: sig
        n: xGOr-H7A7RCQBzJvq9jKMjPqJT5AYo1oqP6LmcR2...
        e: AQAB
  securitySchemes:
    api_key:
      type: apiKey
      name: authorization
      in: header
