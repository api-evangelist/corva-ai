openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Users API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Users
  description: User, API key, and session management
paths:
  /v1/.well-known/jwks.json:
    get:
      summary: Get JWKS public keys
      tags:
      - Users
      description: Returns JSON Web Key Set (JWKS) containing public keys for verifying RS256-signed JWT tokens. This is a public endpoint that does not require authentication. External services can use these keys to verify tokens issued by this API. Returns an empty keys array if JWKS is not configured.
      operationId: getJwks
      responses:
        '200':
          description: JWKS public key set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'
  /v1/user_token#1:
    post:
      summary: Obtain user token via email + password authentication
      tags:
      - Users
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: New JSON Web Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
      description: 'Authenticates user and returns JWT tokens. By default returns HMAC tokens (HS256). For JWKS tokens (RS256), include "X-Token-Format: jwks" header or add "token_format: jwks" to auth params.'
      parameters:
      - in: header
        name: X-Token-Format
        description: 'Token format (optional): "jwks" or "rsa" for RSA-signed tokens'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPasswordAuthentication'
        description: Authentication Data
        required: true
      operationId: postV1UserToken#1
      x-operation-id-source: derived
  /v1/user_token#2:
    post:
      summary: Obtain user token via Auth0 SSO authentication
      tags:
      - Users
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: New JSON Web Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
      description: 'Authenticates user via Auth0 and returns JWT tokens. By default returns HMAC tokens (HS256). For JWKS tokens (RS256), include "X-Token-Format: jwks" header or add "token_format: jwks" to auth params.'
      parameters:
      - in: header
        name: X-Token-Format
        description: 'Token format (optional): "jwks" or "rsa" for RSA-signed tokens'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth0Authentication'
        description: Authentication Data
        required: true
      operationId: postV1UserToken#2
      x-operation-id-source: derived
  /v1/user_token#3:
    post:
      summary: Obtain user token via email + password authentication with multi-factor…
      tags:
      - Users
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: New JSON Web Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
      description: 'Authenticates user with MFA and returns JWT tokens. By default returns HMAC tokens (HS256). For JWKS tokens (RS256), include "X-Token-Format: jwks" header or add "token_format: jwks" to auth params.'
      parameters:
      - in: header
        name: X-Token-Format
        description: 'Token format (optional): "jwks" or "rsa" for RSA-signed tokens'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailPasswordMFAAuthentication'
        description: Authentication Data
        required: true
      operationId: postV1UserToken#3
      x-operation-id-source: derived
  /v1/user_token#4:
    post:
      summary: Refresh jwt token using refresh_token
      tags:
      - Users
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: New JSON Web Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
      description: 'Refreshes JWT token using refresh_token. By default returns HMAC tokens (HS256). For JWKS tokens (RS256), include "X-Token-Format: jwks" header or add "token_format: jwks" to auth params.'
      parameters:
      - in: header
        name: X-Token-Format
        description: 'Token format (optional): "jwks" or "rsa" for RSA-signed tokens'
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenAuthentication'
        description: Authentication Data
        required: true
      operationId: postV1UserToken#4
      x-operation-id-source: derived
  /v1/sessions/verification/request:
    post:
      summary: Request verification code
      tags:
      - Users
      responses:
        '200':
          description: Verification code requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  identity_verification:
                    type: object
                    properties:
                      required:
                        type: boolean
                      enabled:
                        type: boolean
                      available_modes:
                        type: array
                        items:
                          type: string
                      enabled_modes:
                        type: array
                        items:
                          type: string
                  triggered:
                    type: boolean
      requestBody:
        content:
          application/json:
            schema: {}
        description: Mode
      operationId: postV1SessionsVerificationRequest
      x-operation-id-source: derived
  /v1/sessions/schemas:
    get:
      summary: Get available authentication schemas
      tags:
      - Users
      parameters:
      - in: query
        name: email
        description: User email
        schema:
          type: string
      - in: query
        name: provider
        description: Provider name to filter by
        schema:
          type: string
      - in: query
        name: connection
        description: Connection name to filter by
        schema:
          type: string
      - in: query
        name: with_provider
        description: Include provider and respond with extended format or not. "false" by default.
        schema:
          type: boolean
      responses:
        '200':
          description: List of available schemas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthenticationSchema'
      operationId: getV1SessionsSchemas
      x-operation-id-source: derived
