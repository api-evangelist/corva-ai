          type: object
          properties:
            id:
              type: integer
              format: int64
            ability:
              type: string
            resource_class:
              type: string
            resource_id:
              type: integer
              format: int64
            resource_name:
              type: string
            conditions:
              type: json
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            company:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
            owner:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: integer
                      format: int64
                    type:
                      type: string
