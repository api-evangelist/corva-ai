    AuthenticationSchemaContextV2:
      properties:
        id:
          type: string
        type:
          type: string
          example: authentication_schema_context
        attributes:
          type: object
          properties:
            context_type:
              type: string
              enum:
              - Company
              - CompanyDomain
              - User
              description: Polymorphic context discriminator. `Company` rows apply company-wide, `CompanyDomain` rows match users whose email domain is on that domain, `User` rows are per-user overrides.
            context_id:
              type: integer
              format: int64
              description: ID of the referenced Company, CompanyDomain, or User row.
            context_label:
              type: string
              description: Human-readable identifier for the context (Company.name / CompanyDomain.domain / User.email). Returns `"(unknown)"` if the underlying row was deleted out from under the context.
            provisioner:
              type: string
              description: Where group membership originates. `internal` = Corva-managed; `client` = derived from the IdP via the SSO broker.
            created_at:
              type: string
              format: date-time
            schema:
              type: object
              description: Inlined `AuthenticationSchema` details + per-caller ownership flags. Returned inline (not via a JSON:API relationship) so the FE has the ownership context without a follow-up `?include=` request.
              properties:
                id:
                  type: integer
                  format: int64
                title:
                  type: string
                  example: Google Workspace
                provider:
                  type: string
                  example: google
                connection:
                  type: string
                  example: acme-google-workspace
                owner_company_id:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  description: Owning company id, or null for global / shared schemas.
                is_global:
                  type: boolean
                  description: True when `owner_company_id` is null.
                is_owned_by_current_company:
                  type: boolean
                  description: True when the schema is owned by the company being queried.
