openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Security API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Security
  description: Manage security policies, permissions, and groups
paths:
  /v2/companies/{company_id}/authentication_schemas:
    get:
      summary: List authentication schemas usable by the company
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Authentication schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationSchemaV2List'
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2CompaniesByCompanyIdAuthenticationSchemas
      x-operation-id-source: derived
  /v2/companies/{company_id}/authentication_schemas/{id}:
    get:
      summary: Show an authentication schema
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not visible from this company
        '200':
          description: Authentication schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationSchemaV2Single'
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Authentication Schema ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2CompaniesByCompanyIdAuthenticationSchemasById
      x-operation-id-source: derived
    delete:
      summary: Delete an authentication schema
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not visible from this company
        '200':
          description: Deleted
        '422':
          description: Refused — global schemas cannot be deleted from a company-scoped URL
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Authentication Schema ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: deleteV2CompaniesByCompanyIdAuthenticationSchemasById
      x-operation-id-source: derived
  /v2/companies/{company_id}/company_domains:
    get:
      summary: List company domains
      description: Returns every CompanyDomain row for the given company. Cross-tenant queries (admin of company A reading company B) return 403.
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Company domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomainV2List'
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2CompaniesByCompanyIdCompanyDomains
      x-operation-id-source: derived
    post:
      summary: Create a company domain
      description: Restricted to company admins.
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created company domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomainV2Single'
        '400':
          description: Validation error (e.g. domain already claimed exclusively)
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDomainV2Payload'
        required: true
      operationId: postV2CompaniesByCompanyIdCompanyDomains
      x-operation-id-source: derived
  /v2/companies/{company_id}/company_domains/{id}:
    get:
      summary: Show a company domain
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not found
        '200':
          description: Company domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomainV2Single'
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Company Domain ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2CompaniesByCompanyIdCompanyDomainsById
      x-operation-id-source: derived
    patch:
      summary: Update a company domain
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not found
        '200':
          description: Updated company domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDomainV2Single'
        '400':
          description: Validation error
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Company Domain ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDomainV2Payload'
        required: true
      operationId: patchV2CompaniesByCompanyIdCompanyDomainsById
      x-operation-id-source: derived
    delete:
      summary: Delete a company domain
      tags:
      - Security
      responses:
        '401':
          description: Missing or invalid authentication
        '403':
          description: Cross-tenant or insufficient permissions
        '404':
          description: Not found
        '200':
          description: Deleted
      parameters:
      - in: path
        name: company_id
        description: Company ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Company Domain ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: deleteV2CompaniesByCompanyIdCompanyDomainsById
      x-operation-id-source: derived
  /v2/groups:
    get:
