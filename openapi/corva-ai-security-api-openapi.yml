        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupUser'
      parameters:
      - in: path
        name: id
        description: Group ID
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: per_page
        description: Number of items to list per page
        schema:
          type: integer
      - in: query
        name: page
        description: Current page of items
        schema:
          type: integer
      - in: query
        name: sort
        description: A field to sort by
        schema:
          type: string
          enum:
          - first_name
          - created_at
          - updated_at
          default: first_name
      - in: query
        name: order
        description: A sorting direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - in: query
        name: search
        description: Search by first_name, last_name, email
        schema:
          type: string
      operationId: getV2GroupsByIdUsers
      x-operation-id-source: derived
