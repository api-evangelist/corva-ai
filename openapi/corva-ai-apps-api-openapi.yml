openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Apps API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Apps
  description: Manage Apps
paths:
  /v2/apps:
    get:
      summary: List accessible apps
      tags:
      - Apps
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppList'
      parameters:
      - in: query
        name: provider
        description: Company Provider name
        schema:
          items:
            type: string
      - in: query
        name: company_id
        description: Company ID
        schema:
          items:
            type: integer
      - in: query
        name: type
        description: App type filter
        schema:
          items:
            type: string
      - in: query
        name: segment
        description: App segment filter
        schema:
          items:
            type: string
      - in: query
        name: app_category_id
        description: AppCategory filter
        schema:
          items:
            type: integer
      - in: query
        name: category
        description: App category filter
        schema:
          items:
            type: string
      - in: query
        name: label
        description: App label
        schema:
          items:
            type: string
      - in: query
        name: owner
        description: Search by the user ID of the owner of the app
        schema:
          items:
            type: integer
      - in: query
        name: installed
        description: App installed filter
        schema:
          type: boolean
      - in: query
        name: search
        description: Search app by name/description/summary/app_key
        schema:
          type: string
      - in: query
        name: sort
        description: 'One or more fields to sort by. Prefix with a - for descending order. Ex: name,-updated_at'
        schema:
          type: string
          enum:
          - name
          - app_type
          - category
          - created_at
          - updated_at
      - in: query
        name: order
        description: A sorting direction
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - in: query
        name: visibility
        description: Filter by visibility
        schema:
          type: string
          enum:
          - public
          - company
          - developer
          - private
      - in: query
        name: marketing_level
        description: Filter by marketing level
        schema:
          type: string
          enum:
          - normal
          - featured
          - promoted
      - in: query
        name: followable
        description: Filter by followable flag
        schema:
          type: boolean
      - in: query
        name: app_key
        description: Filter by app key
        schema:
          type: string
      - in: query
        name: platform
        description: Filter by platform
        schema:
          type: string
      - in: query
        name: subscribed
        description: Filter by subscribed/unsubscribed
        schema:
          type: boolean
      - in: query
        name: rig_fleet_id
        description: Filter by subscribed Rig
        schema:
          type: integer
      - in: query
        name: frac_fleet_id
        description: Filter by subscribed Frac Fleet
        schema:
          type: integer
      - in: query
        name: drillout_unit_id
        description: Filter by subscribed Drillout Unit
        schema:
          type: integer
      - in: query
        name: page
        description: Number of page
        schema:
          type: integer
      - in: query
        name: per_page
        description: Number of items to list per page
        schema:
          type: integer
      - in: query
        name: not_requested
        description: Filter by non-requested apps
        schema:
          type: boolean
      - in: query
        name: not_purchased
        description: Filter by non-purchased apps
        schema:
          type: boolean
      - in: query
        name: log_type
        description: Filter by log type. Can be "time", "depth" or "all"
        schema:
          type: string
      - in: query
        name: full_lambda_name
        description: Find by full_lambda_name
        schema:
          type: string
      - in: query
        name: followable_scheduler_type
        description: Filter by BE app scheduler type allowed to follow. Can be used only when followable - true.
        schema:
          type: string
      - in: query
        name: show_depends_apps
        description: Show 2-tier depends_on_apps data
        schema:
          type: boolean
      - in: query
        name: can_update
        description: Filter Apps by ability to update
        schema:
          type: boolean
      - in: query
        name: exclude_categories
        description: Array of app categories to exclude apps from request f.e. settings
        schema:
          type: array
          items:
            type: string
      - in: query
        name: app_ids
        description: Filter apps by ID
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: exclude_ids
        description: Filter out apps by ID
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: exclude_app_keys
        description: Array of app keys to exclude apps from request
        schema:
          type: array
          items:
            type: string
      - in: query
        name: dataset_id
        description: Filter by Dataset ID
        schema:
          type: integer
      - in: query
        name: author_id
        description: Filter by Author
        schema:
          type: integer
      - in: query
        name: temporary
        description: Filter permanent/temporary
        schema:
          type: boolean
          enum:
          - 'true'
          - 'false'
      operationId: getV2Apps
      x-operation-id-source: derived
    post:
      summary: Create an app
      tags:
      - Apps
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/App'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppPayload'
        description: App Payload
        required: true
      operationId: postV2Apps
      x-operation-id-source: derived
  /v2/apps/{id}:
