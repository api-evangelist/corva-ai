                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '302':
          description: Fetches a file from S3 link and gets it downloaded
      parameters:
      - in: path
        name: app_id
        description: App ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Package ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2AppsByAppIdPackagesByIdDownload
      x-operation-id-source: derived
