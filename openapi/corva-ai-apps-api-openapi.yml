            application/json:
              schema:
                $ref: '#/components/schemas/App'
      parameters:
      - in: path
        name: id
        description: App ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2AppsById
      x-operation-id-source: derived
    patch:
      summary: Update an App
