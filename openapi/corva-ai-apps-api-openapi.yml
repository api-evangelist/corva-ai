components:
  schemas:
    AppHelpContentPayload:
      properties:
        app_help_content:
          type: object
          properties:
            title:
              type: string
            description:
              type: text
            position:
              type: integer
            status:
              type: string
              enum:
              - draft
              - published
            visibility:
              type: string
              enum:
              - public
              - company
            app_id:
              type: integer
            author_id:
              type: integer
            attachment_metadata:
              type: array
              items:
                properties:
                  file_name:
                    type: string
                  type:
                    type: string
            article_content:
              type: text
      example:
        app_help_content:
          title: Help Title
          description: Help description
          position: 1
          status: draft
          visibility: public
          app_id: 1
          author_id: 2
          attachment_metadata:
          - file_name: example.mp4
            type: video
          article_content: Article text
    AppCategoryLookUp:
      properties:
        identifier:
          type: string
        description:
          type: string
    AppErrorAlertPayload:
      properties:
        app_error_alert:
          type: object
          properties:
            errors_number:
              type: integer
            period:
              type: string
              enum:
              - minute
              - hour
              - day
              - week
              - month
            notification_types:
              type: array
      example:
        app_error_alert:
          errors_number: 50
          period: week
          notification_types:
          - mobile
          - desktop
    PackageList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Package'
    AppHelpContentList:
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AppHelpContent'
    UpdateAppPayload:
      properties:
        app:
          type: object
          properties:
            app_key:
              type: string
            app_type:
              type: string
            scheduler_type:
              type: integer
            package_type:
              type: string
            name:
              type: string
            website:
              type: string
            description:
              type: string
            summary:
              type: string
            version:
              type: string
            category:
              type: string
            manager:
              type: string
            visibility:
              type: string
            marketing_level:
              type: string
            segment:
              type: array
            source_type:
              type: array
            pricing:
              type: object
            settings:
              type: object
            dependent_app_ids:
              type: array
            depends_on_app_ids:
              type: array
            icon:
              type: string
              format: binary
            temporary:
              type: boolean
            delete_at:
              type: string
              format: date-time
