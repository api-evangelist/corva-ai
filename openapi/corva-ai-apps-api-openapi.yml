          description: CustomApp1 description
          summary: CustomApp1 summary
          website: http://example.com
          version: 13.4.4
          manager: FracFleet
          temporary: false
          delete_at: '2020-01-01T00:00:00.000Z'
          pricing:
            tier1: '12300'
            tier2: '900003'
          settings:
            setting1: foobar
            setting2: some_s3_link
          icon: icon.png
          dependent_app_ids:
          - 12345
          - 12346
          - 12347
          depends_on_app_ids:
          - 12345
