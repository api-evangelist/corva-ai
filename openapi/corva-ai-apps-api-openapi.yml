  /v2/apps/{app_id}/packages/upload:
    post:
      summary: Upload a new package for an app
      description: Upload a ZIP file for the Dev Center Packager to build and deploy
      tags:
      - Apps
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Package'
      parameters:
      - in: path
        name: app_id
        description: App ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                package:
                  type: string
                  description: Package ZIP file (field name must be package)
                  format: binary
                github_username:
                  type: string
                  description: Github username (optional)
                prebuilt:
                  type: boolean
                  description: If true, indicates the uploaded zip is already built
                source:
                  type: string
                  description: Request source (e.g. 'ui')
              required:
              - package
      operationId: postV2AppsByAppIdPackagesUpload
      x-operation-id-source: derived
  /v2/apps/{app_id}/packages/{id}/download:
