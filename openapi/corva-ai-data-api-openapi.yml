          title: Sort
        description: Sort conditions as JSON string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Aggregate Api V1 Data  Provider   Dataset  Aggregate  Get
        '422':
          description: Validation Error
          content:
