  /api/v1/subscriptions/{provider}/{dataset}/{asset_id}/:
    post:
      tags:
      - Data
      summary: Publish data to Corva Subscriptions Server
      description: Publish data to **Corva Subscriptions Server** channel named `{provider}/{dataset}/{asset_id}`.
      operationId: publish_api_v1_subscriptions__provider___dataset___asset_id___post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      - name: asset_id
        in: path
        required: true
        schema:
          type: integer
          title: Asset Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
              examples:
              - key_1: value_1
                key_2: value_2
                key_n: value_n
              - - key_1: value_1
                  key_2: value_2
                - key_1: value_3
                  key_2: value_4
              title: Data
            examples:
              objectExample:
                summary: Single-object payload
                description: An example of sending a single JSON object.
                value:
                  key_1: value_1
                  key_2: value_2
                  key_n: value_n
              listExample:
                summary: List payload
                description: An example of sending a JSON array of objects.
                value:
                - key_1: value_1
                  key_2: value_2
                - key_1: value_3
                  key_2: value_4
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
