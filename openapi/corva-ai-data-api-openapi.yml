openapi: 3.2.0
info:
  title: Corva Ai Data API
  version: '1.0'
  description: 'Operations tagged data across 2 of this provider''s published API definitions: corva-ai-data-api-openapi-original.json, corva-ai-platform-api-swagger-original.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Data
  description: Operations to send and receive data from Datasets
paths:
  /api/v1/data/{provider}/{dataset}/:
    get:
      tags:
      - Data
      summary: Find Data
      operationId: getDataByProviderAndDataset
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: 'Number of records to skip (default: 0)'
          default: 0
          title: Skip
        description: 'Number of records to skip (default: 0)'
      - name: limit
        in: query
        required: true
        schema:
          type: integer
          maximum: 10000
          minimum: 1
          description: Maximum number of results to return
          title: Limit
        description: Maximum number of results to return
      - name: fields
        in: query
        required: false
        schema:
          type: string
          description: Comma separated list of fields to return
          title: Fields
        description: Comma separated list of fields to return
      - name: include_count
        in: query
        required: false
        schema:
          type: boolean
          description: Include total count of matching documents in Total header
          default: false
          title: Include Count
        description: Include total count of matching documents in Total header
      - name: sort
        in: query
        required: true
        schema:
          type: string
          description: Sort conditions as JSON string
          examples:
          - '{"timestamp": 1}'
          title: Sort
        description: Sort conditions as JSON string
      - name: query
        in: query
        required: true
        schema:
          type: string
          description: Search conditions
          examples:
          - '{"asset_id": 1}'
          title: Query
        description: Search conditions
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataDocument'
                title: Response Getdatabyprovideranddataset
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Data
      summary: Insert new Documents
      operationId: create_api_v1_data__provider___dataset___post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: array
                items:
                  $ref: '#/components/schemas/DataCreate'
                minItems: 1
                maxItems: 1000
              - $ref: '#/components/schemas/DataCreateWithMessageProduce'
              title: Data
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCreateResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Data
      summary: Insert new Document
      operationId: replace_api_v1_data__provider___dataset___put
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      - name: id
        in: query
        required: false
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDocument'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Data
      summary: Delete multiple Documents
      operationId: delete_many_api_v1_data__provider___dataset___delete
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      - name: query
        in: query
        required: true
        schema:
          type: string
          description: A query that matches the documents to delete
          examples:
          - '{"asset_id": 1}'
          title: Query
        description: A query that matches the documents to delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeleteManyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
