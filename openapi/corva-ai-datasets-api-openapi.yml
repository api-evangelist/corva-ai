      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: action
        in: path
        required: true
        schema:
          type: string
          title: Action
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexSerializer'
        '422':
          description: Validation Error
          content:
