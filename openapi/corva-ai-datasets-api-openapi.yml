openapi: 3.2.0
info:
  title: Corva Ai Datasets API
  version: '1.0'
  description: 'Operations tagged datasets across 2 of this provider''s published API definitions: corva-ai-data-api-openapi-original.json, corva-ai-platform-api-swagger-original.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Datasets
  description: Interactions with Datasets and Indexes
paths:
  /api/v1/dataset/:
    get:
      tags:
      - Datasets
      summary: Get All Datasets
      operationId: index_api_v1_dataset__get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
          description: Search by dataset name
          default: ''
          title: Search
        description: Search by dataset name
      - name: plottable
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by plottable datasets
          title: Plottable
        description: Filter by plottable datasets
      - name: temporary
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by temporary datasets
          title: Temporary
        description: Filter by temporary datasets
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetSerializer'
                title: Response Index Api V1 Dataset  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dataset/company/:
    get:
      tags:
      - Datasets
      summary: Get Datasets By Company
      operationId: by_company_api_v1_dataset_company__get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: plottable
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by plottable datasets
          title: Plottable
        description: Filter by plottable datasets
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DataType'
          - type: 'null'
          description: 'Filter by dataset type: time, depth, reference'
          title: Type
        description: 'Filter by dataset type: time, depth, reference'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDatasetSerializer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dataset/{provider}/{name}/:
    get:
      tags:
      - Datasets
      summary: Get Dataset
      operationId: fetch_api_v1_dataset__provider___name___get
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSerializer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Datasets
      summary: Create Dataset
      operationId: create_api_v1_dataset__provider___name___post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSerializer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Datasets
      summary: Update Dataset
      operationId: update_api_v1_dataset__provider___name___patch
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSerializer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Datasets
      summary: Delete Dataset
      operationId: delete_api_v1_dataset__provider___name___delete
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Delete Api V1 Dataset  Provider   Name   Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dataset/{provider}/{dataset}/index/{index}/:
    get:
      tags:
