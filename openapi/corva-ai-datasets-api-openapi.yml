        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      - name: index
        in: path
        required: true
        schema:
          type: string
          title: Index
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexSerializer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Datasets
      summary: Delete Index
      operationId: delete_index_api_v1_dataset__provider___dataset__index__index___delete
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      - name: index
        in: path
        required: true
        schema:
          type: string
          title: Index
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Delete Index Api V1 Dataset  Provider   Dataset  Index  Index   Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dataset/{provider}/{dataset}/index/:
    post:
      tags:
      - Datasets
      summary: Create Index
      operationId: create_index_api_v1_dataset__provider___dataset__index__post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexSchema'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexSerializer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dataset/{provider}/{dataset}/index/{name}/check/:
    post:
      tags:
      - Datasets
      summary: Check Index
      operationId: check_index_api_v1_dataset__provider___dataset__index__name__check__post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
          title: Dataset
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexSerializer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dataset/{provider}/{dataset}/index/{name}/{action}/:
    post:
      tags:
      - Datasets
      summary: Perform Index Action
      operationId: perform_index_action_api_v1_dataset__provider___dataset__index__name___action___post
      security:
      - HTTPBearer: []
      - APIKeyHeader: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: dataset
        in: path
        required: true
        schema:
          type: string
