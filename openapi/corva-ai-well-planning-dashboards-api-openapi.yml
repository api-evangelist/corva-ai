openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Well Planning Dashboards API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Well Planning Dashboards
paths:
  /v2/well_planning_dashboards:
    get:
      summary: List well planning dashboards
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellPlanningDashboardV2List'
      parameters:
      - in: query
        name: company_id
        description: Filter by company ID
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: asset_id
        description: Filter by asset ID (well)
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: type
        description: 'Filter by type: custom_well_planning_dashboard (default) or default_well_planning_dashboard'
        required: false
        schema:
          type: string
      operationId: getV2WellPlanningDashboards
      x-operation-id-source: derived
    post:
      summary: Create a custom planning dashboard for a well
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created well planning dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellPlanningDashboardV2Response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellPlanningDashboardV2Payload'
        description: Well Planning Dashboard Payload
        required: true
      operationId: postV2WellPlanningDashboards
      x-operation-id-source: derived
  /v2/well_planning_dashboards/{id_or_slug}:
    get:
      summary: Show well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellPlanningDashboardV2Response'
      parameters:
      - in: path
        name: id_or_slug
        description: Dashboard ID or slug
        required: true
        schema:
          type: string
      - in: query
        name: asset_id
        description: Asset ID used for dashboard timezone/unit overrides
        required: false
        schema:
          type: integer
          format: int64
      operationId: getV2WellPlanningDashboardsByIdOrSlug
      x-operation-id-source: derived
    patch:
      summary: Update a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated well planning dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WellPlanningDashboardV2Response'
      parameters:
      - in: path
        name: id_or_slug
        description: Dashboard ID or slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellPlanningDashboardV2UpdatePayload'
        description: Well Planning Dashboard Payload
        required: true
      operationId: patchV2WellPlanningDashboardsByIdOrSlug
      x-operation-id-source: derived
    delete:
      summary: Delete a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Well planning dashboard deleted
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
      parameters:
      - in: path
        name: id_or_slug
        description: Dashboard ID or slug
        required: true
        schema:
          type: string
      operationId: deleteV2WellPlanningDashboardsByIdOrSlug
      x-operation-id-source: derived
  /v2/well_planning_dashboards/{well_planning_dashboard_id_or_slug}/dashboard_apps:
    post:
      summary: Create a dashboard app on a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created dashboard app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardApp'
      parameters:
      - in: path
        name: well_planning_dashboard_id_or_slug
        description: Well Planning Dashboard ID or slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellPlanningDashboardAppV2Payload'
        description: Dashboard App Payload
        required: true
      operationId: postV2WellPlanningDashboardsByWellPlanningDashboardIdOrSlugDashboardApps
      x-operation-id-source: derived
    put:
      summary: Batch update dashboard apps on a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated dashboard apps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAppList'
      parameters:
      - in: path
        name: well_planning_dashboard_id_or_slug
        description: Well Planning Dashboard ID or slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardAppBatchUpdatePayload'
        description: Dashboard apps to update
        required: true
      operationId: putV2WellPlanningDashboardsByWellPlanningDashboardIdOrSlugDashboardApps
      x-operation-id-source: derived
  /v2/well_planning_dashboards/{well_planning_dashboard_id_or_slug}/dashboard_apps/bulk_create:
    post:
      summary: Bulk create dashboard apps on a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created dashboard apps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardAppList'
      parameters:
      - in: path
        name: well_planning_dashboard_id_or_slug
        description: Well Planning Dashboard ID or slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellPlanningDashboardAppV2BulkCreatePayload'
        description: Dashboard Apps Bulk Create Payload
        required: true
      operationId: postV2WellPlanningDashboardsByWellPlanningDashboardIdOrSlugDashboardAppsBulkCreate
      x-operation-id-source: derived
  /v2/well_planning_dashboards/{well_planning_dashboard_id_or_slug}/dashboard_apps/{id}:
    get:
      summary: Show dashboard app on a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardApp'
      parameters:
      - in: path
        name: well_planning_dashboard_id_or_slug
        description: Well Planning Dashboard ID or slug
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: Dashboard App ID
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: filter_asset_id
        description: Data filter's Asset ID
        required: false
        schema:
          type: integer
          format: int64
      operationId: getV2WellPlanningDashboardsByWellPlanningDashboardIdOrSlugDashboardAppsById
      x-operation-id-source: derived
    patch:
      summary: Update dashboard app on a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated dashboard app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardApp'
      parameters:
      - in: path
        name: well_planning_dashboard_id_or_slug
        description: Well Planning Dashboard ID or slug
        required: true
        schema:
          type: string
      - in: path
        name: id
        description: Dashboard App ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WellPlanningDashboardAppV2Payload'
        description: Dashboard App Payload
        required: true
      operationId: patchV2WellPlanningDashboardsByWellPlanningDashboardIdOrSlugDashboardAppsById
      x-operation-id-source: derived
    delete:
      summary: Delete dashboard app from a well planning dashboard
      tags:
      - Well Planning Dashboards
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Dashboard app deleted
      parameters:
      - in: path
        name: well_planning_dashboard_id_or_slug
