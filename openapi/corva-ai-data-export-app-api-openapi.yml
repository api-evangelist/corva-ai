openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Data Export App API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Data Export App
paths:
  /v2/data_export_app:
    get:
      summary: Get enriched well export data
      tags:
      - Data Export App
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportWellList'
      parameters:
      - in: query
        name: page
        description: Page number for pagination
        schema:
          type: integer
      - in: query
        name: per_page
        description: Number of items per page
        schema:
          type: integer
      - in: query
        name: visibility
        description: Filter by Well visibility
        schema:
          type: string
      - in: query
        name: company_ids
        description: Filter by company IDs
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: well_ids
        description: Filter by Well IDs
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: asset_ids
        description: Filter by Asset IDs
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: keys
        description: Optional list of metric keys to return under `metrics`
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: drillstring_keys
        description: Optional list of drillstrings keys to return under `drillstrings`
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - in: query
        name: data_type
        description: Optional filter by data.type
        schema:
          type: string
          enum:
          - asset
          - bha
          - well_section
          - rig
          - completion
      - in: query
        name: sort_field
        description: Field to sort by (e.g. `county`, `rig_type`, `bit_depth`, etc.)
        schema:
          type: string
      - in: query
        name: sort_direction
        description: Sort direction
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: filters[].field
        description: Field name to filter by (e.g. `county`, `bit_depth`)
        schema:
          type: string
      - in: query
        name: filters[].condition
        description: Condition for filtering
        schema:
          type: string
          enum:
          - is_equal
          - is_not_equal
          - text_contains
          - text_does_not_contain
          - text_is_exactly
      - in: query
        name: filters[].value
        description: Value to compare against
        schema:
          type: string
      operationId: getV2DataExportApp
      x-operation-id-source: derived
