openapi: 3.2.0
info:
  version: v2.222.1
  title: Corva Alerts API
  description: 'The Corva API is a powerful interface providing great flexibility and extensibility with Corva. Whether your needs are simple UI visualizations, data entry, replication/sync tasks, real-time stream processing, or complex machine learning CPU-intensive apps, the Corva API is the way to make it happen. Our concepts are split into three distinct silos: data apps, visualization apps, and a REST API'
  termsOfService: https://www.corva.ai/terms-and-conditions/
  contact:
    name: Corva API Team
    email: support@corva.ai
security:
- api_key: []
tags:
- name: Alerts
  description: Manage Alerts
paths:
  /v2/alerts/{alert_id}/activities:
    get:
      summary: List Alert Activities
      tags:
      - Alerts
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alert not found
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        attributes:
                          $ref: '#/components/schemas/AlertActivity'
        '400':
          description: Invalid activity filter
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: order
        description: 'Sort order by created_at (started_at is an alias): desc (default) or asc'
        schema:
          type: string
          enum:
          - desc
          - asc
      - in: query
        name: activity
        description: Filter by activity type
        schema:
          type: string
          enum:
          - status_change
          - classification
          - level_change
          - escalation
          - renotified
          - rearmed
      - in: query
        name: user_id
        description: Filter by user ID
        schema:
          type: integer
          format: int64
      - in: query
        name: page
        description: Page number
        schema:
          type: integer
      - in: query
        name: per_page
        description: Items per page, default 25, max 100
        schema:
          type: integer
      operationId: getV2AlertsByAlertIdActivities
      x-operation-id-source: derived
  /v1/alerts/{alert_id}/comments/:
    get:
      summary: List comments for alert
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV1AlertsByAlertIdComments
      x-operation-id-source: derived
    post:
      summary: Create a comment for alert
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created alert comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPayload'
        description: Comment Payload
        required: true
      operationId: postV1AlertsByAlertIdComments
      x-operation-id-source: derived
  /v1/alerts/{alert_id}/comments/{id}:
    get:
      summary: Show comment for alert
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV1AlertsByAlertIdCommentsById
      x-operation-id-source: derived
    patch:
      summary: Update an alert comment
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Updated alert comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPayload'
        description: Comment Payload
        required: true
      operationId: patchV1AlertsByAlertIdCommentsById
      x-operation-id-source: derived
    delete:
      summary: Delete an alert comment
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Alert comment deleted
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: deleteV1AlertsByAlertIdCommentsById
      x-operation-id-source: derived
  /v1/alerts/{alert_id}/comments/{comment_id}/likes:
    get:
      summary: List likes for alert's comment
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Like'
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: comment_id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV1AlertsByAlertIdCommentsByCommentIdLikes
      x-operation-id-source: derived
  /v1/alerts/{alert_id}/comments/{comment_id}/likes/toggle:
    post:
      summary: Toggle a like for alert's comment
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created/deleted alert like
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      - in: path
        name: comment_id
        description: Comment ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: postV1AlertsByAlertIdCommentsByCommentIdLikesToggle
      x-operation-id-source: derived
  /v2/alerts/{alert_id}/comments:
    get:
      summary: List Alert Comments
      tags:
      - Alerts
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alert or corresponding activity not found
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommentV2'
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV2AlertsByAlertIdComments
      x-operation-id-source: derived
    post:
      summary: Create Alert Comment
      tags:
      - Alerts
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Alert or corresponding activity not found
        '200':
          description: Created alert comment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommentV2'
        '400':
          description: Missing comment payload
        '422':
          description: Validation error
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentPayload'
        description: Comment Payload
        required: true
      operationId: postV2AlertsByAlertIdComments
      x-operation-id-source: derived
  /v1/alerts/{alert_id}/likes:
    get:
      summary: List likes for alert
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Like'
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: getV1AlertsByAlertIdLikes
      x-operation-id-source: derived
  /v1/alerts/{alert_id}/likes/toggle:
    post:
      summary: Toggle a like for alert
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created/deleted alert like
      parameters:
      - in: path
        name: alert_id
        description: Alert ID
        required: true
        schema:
          type: integer
          format: int64
      operationId: postV1AlertsByAlertIdLikesToggle
      x-operation-id-source: derived
  /v1/alerts/definitions:
    get:
      summary: List Alert Definitions
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertDefinition'
      parameters:
      - in: query
        name: segment
        description: Segments could be nil, a comma-delimited list of strings, or an array
        schema:
          items:
            type: string
            enum:
            - drilling
            - completion
            - intervention
      - in: query
        name: template_type
        description: 'Filter by template type: standard or preset'
        schema:
          type: string
      - in: query
        name: topic
        description: Filter by topic
        schema:
          type: string
      operationId: getV1AlertsDefinitions
      x-operation-id-source: derived
  /v1/alerts/definitions/context:
    get:
      summary: Gather Alert Definition Context
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
      parameters:
      - in: query
        name: asset_id
        description: Asset to gather context from
      - in: query
        name: identifier
        description: Alert definition identifier to check against
      operationId: getV1AlertsDefinitionsContext
      x-operation-id-source: derived
  /v1/alerts/definitions/trigger:
    post:
      summary: Trigger Alert
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
      requestBody:
        content:
          application/json:
            schema: {}
        description: Timestamp to trigger the alert at. Defaults to the current time.
      operationId: postV1AlertsDefinitionsTrigger
      x-operation-id-source: derived
  /v1/alerts/definitions/close:
    post:
      summary: Close Open Alerts
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                status: OK
      requestBody:
        content:
          application/json:
            schema: {}
        description: Timestamp to close the alert at. Defaults to the current time.
      operationId: postV1AlertsDefinitionsClose
      x-operation-id-source: derived
  /v1/alerts/definitions/{alert_definition_id}/check:
    post:
      summary: Check Alert Definition in point of time
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: object
          description: Successful response
          content:
            application/json:
              schema:
                status: OK
                $ref: '#/components/schemas/CheckResponse'
      parameters:
      - in: path
        name: alert_definition_id
        description: Alert definition to check
        required: true
      requestBody:
        content:
          application/json:
            schema: {}
        description: Timestamp
      operationId: postV1AlertsDefinitionsByAlertDefinitionIdCheck
      x-operation-id-source: derived
  /v1/alerts/definitions/templates/{template_type}:
    get:
      summary: List Alert Definition Templates
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          type: array
          description: Successful response - returns templates or their overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertDefinition'
        '400':
          description: Invalid template_type or scope parameter
      parameters:
      - in: path
        name: template_type
        required: true
        description: 'Template type: standard or preset'
        schema:
          type: string
      - in: query
        name: scope
        required: false
        description: Library shelf to list. "corva" (default) lists Corva-owned templates, swapping in the caller's copy where one exists. "company" lists templates owned by the current company. "user" lists the current user's personal templates.
        schema:
          type: string
          enum:
          - corva
          - company
          - user
      operationId: getV1AlertsDefinitionsTemplatesByTemplateType
      x-operation-id-source: derived
  /v1/alerts/definitions/{id}/save_as_template:
    post:
      summary: Save Alert Definition as Library Template
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Caller is not allowed to create templates on the target shelf
        '404':
          description: Alert definition not found
        '200':
          description: The created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDefinition'
        '400':
          description: Invalid template_type or scope parameter
      parameters:
      - in: path
        name: id
        required: true
        description: Source alert definition id
        schema:
          type: integer
          format: int64
      - in: query
        name: template_type
        required: true
        description: 'Template type: standard or preset'
        schema:
          type: string
      - in: query
        name: scope
        required: false
        description: Target library shelf. "company" (default) saves a company-owned template, "user" saves a personal template for the current user, "corva" saves to the Corva library (Corva principals only). The source definition is unaffected.
        schema:
          type: string
          enum:
          - corva
          - company
          - user
      operationId: postV1AlertsDefinitionsByIdSaveAsTemplate
      x-operation-id-source: derived
  /v1/alerts/definitions/{alert_definition_id}/enable:
    post:
      summary: Enable Alert Definition Template
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: User is not authorized to update the given alert group
        '404':
          description: Alert definition not found, belongs to another company, or alert group not found
        '200':
          type: array
          description: Successful response - returns enabled alerts (new copy or existing overrides)
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AlertDefinition'
        '400':
          description: Enabled alert is not valid for the given alert group
      parameters:
      - in: path
        name: alert_definition_id
        required: true
        description: Template alert definition ID to enable
        schema:
          type: integer
      - in: query
        name: alert_group_id
        required: false
        description: Optional alert group to associate the enabled alert with
        schema:
          type: integer
      operationId: postV1AlertsDefinitionsByAlertDefinitionIdEnable
      x-operation-id-source: derived
  /v1/alerts/definitions/{alert_definition_id}/disable:
    post:
      summary: Disable Alert Definition Template
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Alert definition not found or belongs to another company
        '200':
          type: object
          description: Successful response - returns disabled alert override
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDefinition'
        '400':
          description: No enabled alert definition found for this template
      parameters:
      - in: path
        name: alert_definition_id
        required: true
        description: Template alert definition ID to disable
        schema:
          type: integer
      operationId: postV1AlertsDefinitionsByAlertDefinitionIdDisable
      x-operation-id-source: derived
  /v2/alerts/metrics:
    get:
      summary: Alert Occurrence Metrics
      tags:
      - Alerts
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_occurrences:
                    type: integer
                    description: Occurrence rows in the window
                  levels:
                    type: object
                    description: Per-fire level => occurrence count; sums to total_occurrences. Occurrences with no level anywhere are keyed UNKNOWN
                  alert_definitions:
                    type: array
                    items:
                      type: object
                      properties:
                        alert_definition_id:
                          type: integer
                          format: int64
                        alert_definition_name:
                          type: string
                        count:
                          type: integer
                          description: Occurrence rows in the window for this definition
        '400':
          description: Invalid timestamp, range, or top
      parameters:
      - in: query
        name: last_alert_start
        description: Occurrence window lower bound (ms); defaults to 7 days ago
        schema:
          type: integer
      - in: query
        name: last_alert_end
        description: Occurrence window upper bound (ms); defaults to now
        schema:
          type: integer
      - in: query
        name: top
        description: Number of top alert definitions to return; defaults to 10, max 50
        schema:
          type: integer
      - in: query
        name: levels
        description: Filter by per-fire level; comma-separated
        schema:
          type: string
