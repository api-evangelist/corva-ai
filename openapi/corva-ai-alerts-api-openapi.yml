        description: 'Filter by Alert Definition name: a single value or a comma-separated list, matched case-insensitively as substrings'
        required: false
        schema:
          type: string
      - in: query
        name: status
        description: 'Filter by Alert status: a single value or a comma-separated list (e.g. open,acknowledged)'
        required: false
        schema:
          type: string
      - in: query
        name: alert_classification
        description: Filter by classification, one of [unclassified, true_positive, false_positive, informational, threshold_reached]
        required: false
        schema:
          type: string
      - in: query
        name: acknowledged
        description: 'Filter by acknowledged flag: true or false; an empty value matches alerts where acknowledged is null'
        required: false
        allowEmptyValue: true
        schema:
          type: string
      - in: query
        name: validation
        description: 'Validation filter: validated or unvalidated (users with the validate ability), valid or invalid otherwise'
        required: false
        schema:
          type: string
      - in: query
        name: subscription
        description: When true, users with the validate ability see only alerts for their own subscriptions (always the case for other users)
        required: false
        schema:
          type: boolean
      - in: query
        name: segment
        description: 'Filter by segment: a single key, a comma-separated list, or an array'
        required: false
        schema:
          type: string
      - in: query
        name: levels
        description: 'Filter by alert level: a single value or a comma-separated list'
        required: false
        schema:
          type: string
      - in: query
        name: level
        description: Alias for levels
        required: false
        schema:
          type: string
      - in: query
        name: rigs
        description: 'Filter by rig: a comma-separated list of rig asset ids matching the well parent'
        required: false
        schema:
          type: string
      - in: query
        name: assets
        description: 'Filter by asset: a comma-separated list or an array of asset ids, matching the alert asset, its parent or active child'
        required: false
        schema:
          type: string
      - in: query
        name: interventions
        description: 'Filter by intervention unit: a comma-separated list of intervention unit ids'
        required: false
        schema:
          type: string
      - in: query
        name: sort
        description: Column to sort by, one of [alert_at, last_alert_at, created_at, status, status_changed_at, level, occurrences, acknowledged, validated, alert_classification, name]. Unrecognized values fall back to the default sort (alert_at descending).
        required: false
        schema:
          type: string
          enum:
          - alert_at
          - last_alert_at
          - created_at
          - status
          - status_changed_at
          - level
          - occurrences
          - acknowledged
          - validated
          - alert_classification
          - name
      - in: query
        name: order
        description: Sort direction, asc or desc. Applies only when sort is provided and defaults to asc; without sort, results are returned alert_at descending.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: fields
        description: Sparse fieldset, e.g. fields=alert_details.level,alert_details.asset_name. Absent param returns all fields.
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Page number
        required: false
        schema:
          type: integer
      - in: query
        name: per_page
        description: Items per page
        required: false
        schema:
          type: integer
      operationId: getV2AlertsDetails
      x-operation-id-source: derived
