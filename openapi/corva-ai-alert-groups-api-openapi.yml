      summary: List Alert Groups
      tags:
      - Alert Groups
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: List of alert groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertGroupList'
      parameters:
      - in: query
        name: search
        description: Search by name
        required: false
        schema:
          type: string
      - in: query
        name: page
        description: Page number
        required: false
        schema:
          type: integer
      - in: query
        name: per_page
        description: Items per page
        required: false
        schema:
          type: integer
      operationId: getV2AlertGroups
      x-operation-id-source: derived
    post:
      summary: Create Alert Group
      tags:
      - Alert Groups
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Authorization error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '200':
          description: Created alert group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertGroupSingle'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertGroupPayload'
        required: true
      operationId: postV2AlertGroups
      x-operation-id-source: derived
  /v2/alert_groups/{id}:
