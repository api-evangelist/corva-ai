      x-operation-id-source: derived
  /v2/alert_groups/{id}/merge:
    post:
      summary: Merge Alert Group
      tags:
      - Alert Groups
      responses:
        '401':
          description: Authentication error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationError'
        '403':
          description: Not authorized to update the target or destroy the source
        '404':
          description: Either group is not visible to the caller
        '200':
          description: Merged alert group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertGroupSingle'
        '400':
          description: Missing source_alert_group_id, merging a group into itself, or groups that differ in company or segment
      description: Merges the source group into the group named in the path, which survives. Members, scopes, alert definitions and configurations are unioned; wherever both groups hold the same member, scope target or configuration key, the target group's row is kept and the source's is dropped. The target keeps its own name, workflow and settings. Notification policies scoped to the source follow it to the target. The whole merge is one transaction and cannot be undone.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertGroupMergePayload'
        required: true
      operationId: postV2AlertGroupsByIdMerge
      x-operation-id-source: derived
