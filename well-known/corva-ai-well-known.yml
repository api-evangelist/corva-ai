pointer_basis: >-
  NO WellKnown pointer and NO SecurityTxt pointer are emitted. Every probe below is a miss, and a
  file that documents an absence must never be wired as a presence. Corva authenticates with a
  static API key or a JWT minted at POST https://api.corva.ai/v1/user_token — neither is OAuth 2.0,
  so the absence of the OAuth discovery documents is consistent with the published auth design
  rather than a gap in it.
false_positive_watch: >-
  corva.ai and www.corva.ai return HTTP 404 but with the full 111,921-byte marketing SPA shell as
  the body, and community.corva.ai returns a 14,213-byte "Page Not Found" shell. Those are correctly
  recorded as misses. api.corva.ai is the only host that answers a machine-shaped
  {"status":"Route Not Found"} 404. A future round must not read any of these bodies as a document.
