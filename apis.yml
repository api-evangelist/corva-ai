aid: corva-ai
name: Corva AI
kind: company
description: >-
  Corva is a Houston-based AI software company providing a real-time drilling, completions, geoscience
  and sustainability analytics platform for upstream oil and gas. Corva ingests rig sensor and operational
  data and exposes it through TWO REST APIs on two hosts: the Platform API at api.corva.ai (wells, rigs,
  pads, programs, frac fleets, users, dashboards, alerts and apps; 513 paths and 771 operations described
  by a published Swagger 2.0 contract) and the Data API at data.corva.ai (time, depth, reference and timeseries
  dataset records, aggregations and permitted customer writes; described by a published OpenAPI 3.1 contract).
  Corva Dev Center is an SDK and app-hosting environment where customers build frontend, backend, scheduled,
  stream and task applications on Corva data, with a Python SDK, npm component libraries and a public
  app marketplace. Access is enterprise-only: there is no public pricing, no free tier and no self-serve
  signup, and API key creation is not enabled by default for most customer users.
