apis:
- aid: corva-ai:corva-data-api
  name: Corva Data API
  description: >-
    The Corva Data API serves the records stored in Corva datasets — one-second operational data, engineering
    calculations and metrics, time- and depth-based datasets, reference datasets and aggregation queries
    — plus writes to permitted customer datasets in batches of up to 1,000 records. Reads filter by asset_id
    or company_id with a MongoDB-style query object, a required limit of 1 to 10,000, sort, skip and field
    projection. It publishes an OpenAPI 3.1.0 contract with 27 paths and 40 operations, served with Swagger
    UI at /docs and ReDoc at /redoc.
  humanURL: https://dc-docs.corva.ai/docs/API/API%20Reference/data-api
  baseURL: https://data.corva.ai
  properties:
  - type: OpenAPI
    url: openapi/corva-ai-data-api-openapi.yml
  - type: Documentation
    url: https://dc-docs.corva.ai/docs/API/API%20Reference/data-api
  - type: APIReference
    url: https://dc-docs.corva.ai/docs/API/API%20Reference/data-api
  - type: Swagger
    url: https://data.corva.ai/docs
  - type: Overlay
    url: overlays/corva-ai-data-api-overlay.yaml
  - type: GettingStarted
    url: https://dc-docs.corva.ai/docs/API/quickstart
  tags:
  - Data API
  - Datasets
  - Time Series
  - Real-Time
  - OpenAPI
  - Drilling
- aid: corva-ai:corva-dev-center-api
  name: Corva Dev Center
  description: >-
    Corva Dev Center is an SDK and app hosting environment for building custom applications on top of
    Corva data assets. It provides Python and JavaScript SDKs, UI component libraries, app templates (frontend,
    backend, scheduled, stream, and task apps), cloud deployment tools, and a public app marketplace.
  humanURL: https://dc-docs.corva.ai/docs/intro
  properties:
