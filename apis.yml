- aid: corva-ai:corva-dev-center-api
  name: Corva Dev Center
  description: >-
    Corva Dev Center is an SDK and app hosting environment for building custom applications on top of
    Corva data assets. It provides Python and JavaScript SDKs, UI component libraries, app templates (frontend,
    backend, scheduled, stream, and task apps), cloud deployment tools, and a public app marketplace.
