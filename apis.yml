apis:
- aid: corva-ai:corva-platform-api
  name: Corva Platform API
  description: >-
    The Corva Platform API serves platform entities and their relationships — wells, rigs, drillout units,
    programs, pads and frac fleets, together with users, dashboards, alerts, apps, tasks, files and API
    keys. It is where an integration resolves the asset_id that every Data API query filters on: read
    attributes.asset_id from GET /v2/wells, or the top-level id from GET /v2/assets. It publishes a Swagger
    2.0 contract (version v2.222.1) with 513 paths, 771 operations and 574 definitions, rendered by Swagger
    UI.
  humanURL: https://dc-docs.corva.ai/docs/API/API%20Reference/platform-api
  baseURL: https://api.corva.ai
  properties:
  - type: OpenAPI
    url: openapi/corva-ai-platform-api-openapi.yml
