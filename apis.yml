  - Wells
  - Rigs
  - Swagger
  - Drilling
- aid: corva-ai:corva-data-api
  name: Corva Data API
  description: >-
    The Corva Data API serves the records stored in Corva datasets — one-second operational data, engineering
    calculations and metrics, time- and depth-based datasets, reference datasets and aggregation queries
    — plus writes to permitted customer datasets in batches of up to 1,000 records. Reads filter by asset_id
    or company_id with a MongoDB-style query object, a required limit of 1 to 10,000, sort, skip and field
    projection. It publishes an OpenAPI 3.1.0 contract with 27 paths and 40 operations, served with Swagger
    UI at /docs and ReDoc at /redoc.
  humanURL: https://dc-docs.corva.ai/docs/API/API%20Reference/data-api
  baseURL: https://data.corva.ai
  properties:
  - type: OpenAPI
    url: openapi/corva-ai-data-api-openapi.yml
